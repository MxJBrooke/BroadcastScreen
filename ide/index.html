<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Python IDE - Mx Brooke's Education Resources</title>
    
    <!-- Poppins Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CodeMirror Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
    
    <!-- Skulpt Engine Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        /* --- Core Theme Variables & Inherited Styling Structure --- */
        :root {
            --bg-main: #FFF4E6;
            --header-bg: #4A3E32;
            --header-border: #3D3227;
            --accent-amber: #E69A10;
            --accent-hover: #C5830D;
            --text-dark: #2C241D;
            --text-muted: #6B5B4E;
            --card-bg: #FFFFFF;
            --card-border: #F0D5B7;
            
            /* Hexagon & Angular Cutouts */
            --hex-cut-sm: polygon(8px 0%, calc(100% - 8px) 0%, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0% calc(100% - 8px), 0% 8px);
            --hex-cut-md: polygon(14px 0%, calc(100% - 14px) 0%, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0% calc(100% - 14px), 0% 14px);
            --hex-cut-lg: polygon(22px 0%, calc(100% - 22px) 0%, 100% 22px, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0% calc(100% - 22px), 0% 22px);

            /* Dynamic Indentation Tokens */
            --c1: rgba(255, 118, 117, 0.25);
            --c2: rgba(253, 203, 110, 0.28);
            --c3: rgba(85, 239, 196, 0.28);
            --c4: rgba(116, 185, 255, 0.25);
            --c5: rgba(162, 155, 254, 0.25);
            
            --g1: rgba(46, 204, 113, 0.45);
            --g2: rgba(46, 204, 113, 0.35);
            --g3: rgba(46, 204, 113, 0.25);
            --g4: rgba(46, 204, 113, 0.18);
            --g5: rgba(46, 204, 113, 0.10);

            --editor-fs: 16px;
            --editor-ls: normal;
            --guide-color: rgba(0, 0, 0, 0.08);
        }

        body.access-dark {
            --guide-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            transition: background 0.3s ease, color 0.3s ease, word-spacing 0.3s ease, font-size 0.3s ease;
            word-spacing: normal;
            font-size: 16px;
        }

        /* Dynamically Generated Background Hollow SVG Hexagons */
        .bg-hexagons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-hex {
            position: absolute;
            background: transparent;
        }

        .bg-hex svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke-width: 4px;
            stroke-linejoin: round;
        }

        /* Background Canvas for Interactive Swarming Bee Trails */
        #beeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
        }

        /* --- Header Configuration --- */
        .header {
            width: 100%;
            height: 80px;
            background-color: var(--header-bg);
            border-bottom: 3px solid var(--header-border);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            user-select: none;
            text-decoration: none;
        }

        .brand-section img.logo {
            height: 52px;
            width: auto;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .brand-section:hover img.logo {
            transform: scale(1.08) rotate(-3deg);
        }

        .brand-title {
            color: #FFFFFF;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title::after {
            content: "⬡";
            color: var(--accent-amber);
            font-size: 1.3rem;
        }

        /* --- Action Control Button Styles --- */
        .accessibility-toggle, .accessibility-scale, .ide-btn, .btn-run, .btn-file {
            padding: 8px 16px;
            background-color: var(--accent-amber);
            color: var(--text-dark);
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            border: none;
            clip-path: var(--hex-cut-sm);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            box-sizing: border-box;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 36px;
            line-height: 1;
        }

        .accessibility-toggle:hover, .accessibility-scale:hover, .ide-btn:hover, .btn-run:hover, .btn-file:hover {
            background-color: var(--accent-hover);
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        .btn-run {
            background-color: #2ecc71;
            color: #FFFFFF;
        }

        .btn-run:hover {
            background-color: #27ae60;
            color: #FFFFFF;
        }

        /* --- Header File Action Stack --- */
        .header-file-stack {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #fileInput { display: none; }

        /* --- Accessibility Floating Side Overlay --- */
        .accessibility-panel {
            position: fixed;
            top: 0;
            left: -280px;
            width: 270px;
            height: 100%;
            padding: 24px;
            box-sizing: border-box;
            transition: left 0.3s ease, background 0.3s ease;
            z-index: 1000;
            background: #FFFFFF;
            border-right: 3px solid var(--card-border);
            box-shadow: 4px 0 20px rgba(0,0,0,0.15);
            overflow-y: auto;
            color: var(--text-dark);
        }

        .accessibility-panel.open {
            left: 0;
        }

        .accessibility-panel h3 {
            font-size: 1rem;
            margin-top: 18px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 4px;
            font-weight: 700;
        }

        .accessibility-panel button.close-panel-btn {
            float: right;
            background: var(--header-bg);
            color: #FFFFFF;
            border: none;
            width: 28px;
            height: 28px;
            clip-path: var(--hex-cut-sm);
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .color-spot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin: 5px;
            cursor: pointer;
            border: 2px solid #777;
            display: inline-block;
        }

        /* Icon UI for Indent Selection */
        .style-btn {
            width: 44px;
            height: 44px;
            font-size: 20px;
            clip-path: var(--hex-cut-sm);
            border: none;
            cursor: pointer;
            background: var(--header-bg);
            color: #FFFFFF;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .style-btn:hover { background: var(--accent-amber); color: var(--text-dark); }
        .style-btn.active { background: var(--accent-amber); color: var(--text-dark); box-shadow: inset 0 0 5px rgba(0,0,0,0.3); }

        .accessibility-control {
            margin: 10px 0;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* --- Main App Layout Architecture --- */
        #mainContainer {
            margin-top: 110px;
            width: 92%;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            flex-grow: 1;
            position: relative;
            z-index: 10;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
        }

        .page-title::before, .page-title::after {
            content: "⬡";
            color: var(--accent-amber);
            font-size: 1.6rem;
        }

        /* --- Python IDE Workspace Container Split --- */
        .ide-container {
            display: flex;
            gap: 20px;
            height: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        .editor-container, .output-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            clip-path: var(--hex-cut-md);
            border: 2px solid var(--card-border);
            background: var(--card-bg);
            position: relative;
            box-shadow: 0 6px 16px rgba(74, 62, 50, 0.08);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .ide-toolbar {
            background: var(--header-bg);
            padding: 0 16px;
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.3s ease, color 0.3s ease;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .ide-toolbar-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* --- CodeMirror Component Adaptations --- */
        .CodeMirror {
            position: absolute;
            top: 48px; left: 0; right: 0; bottom: 0;
            height: calc(100% - 48px) !important;
            font-family: 'Courier New', Consolas, monospace !important;
            background: inherit;
            color: inherit;
            font-size: var(--editor-fs) !important;
            letter-spacing: var(--editor-ls) !important;
        }
        
        .CodeMirror-lines, .CodeMirror-code, #output {
            font-size: var(--editor-fs) !important;
            letter-spacing: var(--editor-ls) !important;
        }

        .CodeMirror-lines {
            padding: 10px 0 !important;
        }

        .CodeMirror-code .CodeMirror-line {
            padding: 0 4px !important;
            line-height: 24px !important;
        }

        .CodeMirror-gutters { 
            background: rgba(0, 0, 0, 0.05); 
            border-right: 1px solid rgba(0, 0, 0, 0.15); 
            z-index: 4; 
        }
        .CodeMirror-selected { background: #b4d5fe !important; }

        /* Classic Python IDLE Palette Tokens */
        .cm-s-default .cm-keyword { color: #ff7700; font-weight: bold; }
        .cm-s-default .cm-builtin { color: #900090; }
        .cm-s-default .cm-string { color: #00aa00; }
        .cm-s-default .cm-comment { color: #dd0000; font-style: italic; }
        .cm-s-default .cm-number { color: #000000; }
        .cm-s-default .cm-def { color: #0000ff; font-weight: bold; }

        /* Custom Theme Overrides for Syntax Tokens in Dark Mode */
        body.access-dark .cm-s-default .cm-keyword { color: #ff9f43; }
        body.access-dark .cm-s-default .cm-builtin { color: #a55eea; }
        body.access-dark .cm-s-default .cm-string { color: #1dd1a1; }
        body.access-dark .cm-s-default .cm-comment { color: #ff6b6b; }
        body.access-dark .cm-s-default .cm-number { color: #f5f6fa; }
        body.access-dark .cm-s-default .cm-def { color: #54a0ff; }
        body.access-dark .CodeMirror-selected { background: #341f97 !important; }

        #output {
            background-color: inherit;
            color: inherit;
            padding: 16px;
            font-family: 'Courier New', Consolas, monospace;
            flex: 1;
            overflow-x: auto;
            overflow-y: auto;
            white-space: pre;
            margin: 0;
            position: absolute;
            top: 48px; left: 0; right: 0; bottom: 0;
            height: calc(100% - 48px);
            box-sizing: border-box;
        }

        .terminal-input {
            background: transparent;
            border: none;
            outline: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            letter-spacing: inherit;
            padding: 0;
            margin: 0;
            width: auto;
            display: inline;
            border-bottom: 2px dashed rgba(0, 0, 0, 0.4);
        }
        body.access-dark .terminal-input {
            border-bottom: 2px dashed rgba(255, 255, 255, 0.4);
        }

        .error-line-highlight {
            background-color: rgba(214, 48, 49, 0.25) !important; 
            box-shadow: inset 6px 0 0 0 #d63031 !important; 
        }

        /* --- Contextual Warning Engine Overlays --- */
        @keyframes inline-token-pulse {
            0% { background-color: #ff7675; box-shadow: 0 0 4px #ff7675; }
            50% { background-color: #b33939; box-shadow: 0 0 10px #b33939; }
            100% { background-color: #ff7675; box-shadow: 0 0 4px #ff7675; }
        }
        
        .floating-line-prompt {
            position: absolute;
            z-index: 100;
            padding: 2px 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: bold;
            color: white !important;
            border-radius: 4px;
            animation: inline-token-pulse 1.8s infinite ease-in-out;
            user-select: none;
            border: 1px solid rgba(0,0,0,0.15);
            white-space: nowrap;
            pointer-events: none; 
            display: none;
        }

        .robot-error-box {
            background: #FFEAA7;
            border: 2px solid #E69A10;
            clip-path: var(--hex-cut-sm);
            padding: 15px;
            margin: 10px 0;
            color: #2D3436;
            display: flex;
            gap: 15px;
            font-family: 'Poppins', sans-serif;
            white-space: normal;
            word-break: break-word;
        }
        .robot-mascot { font-size: 36px; display: flex; align-items: center; }
        .error-details h4 { margin: 0 0 5px 0; color: #D63031; font-size: 16px; }
        .error-details p { margin: 0 0 10px 0; font-size: 14px; line-height: 1.4; }
        .error-pointer {
            background: #FFFFFF;
            border: 1px solid #CED6E0;
            padding: 8px;
            clip-path: var(--hex-cut-sm);
            font-family: 'Courier New', Consolas, monospace;
            font-size: 13px;
            margin-top: 5px;
            color: #000;
            white-space: normal;
            word-break: break-word;
        }
        .highlight-line { background: #2D3436; color: white; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        ul.guide-list { margin: 5px 0; padding-left: 20px; font-size: 13px; }

        /* Footer Section */
        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.88rem;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
            position: relative;
            z-index: 10;
            margin-top: auto;
            background-color: rgba(255, 244, 230, 0.85);
        }

        /* Responsive UI Scaling */
        @media (max-width: 900px) {
            .ide-container {
                flex-direction: column;
                height: 900px;
            }
            .editor-container, .output-container {
                height: 440px;
            }
            .header {
                padding: 0 12px;
            }
            .brand-title {
                font-size: 1rem;
            }
            .brand-section img.logo {
                height: 40px;
            }
            #mainContainer {
                margin-top: 95px;
            }
        }
    </style>
</head>
<body>

<!-- Background Dynamic Hexagons Container -->
<div class="bg-hexagons" id="bgHexagonsContainer"></div>

<!-- Background Interactive Canvas -->
<canvas id="beeCanvas"></canvas>

<!-- Header Component -->
<div class="header" id="header">
    <button class="accessibility-toggle" onclick="toggleAccessibility()">Accessibility</button>
    
    <a href="https://www.mxbrooke.co.uk/" class="brand-section" title="Mx Brooke's Education Resources">
        <img src="https://www.mxbrooke.co.uk/images/logo.svg" alt="MXB Logo" class="logo">

    <button class="color-spot" style="background:#fff9c4" onclick="setBackground('yellow')"></button>
    <button class="color-spot" style="background:#e8f5e9" onclick="setBackground('green')"></button>

    <button class="color-spot" style="background:#fce4ec" onclick="setBackground('pink')"></button>

    <h3>Indent Style</h3>
    <div class="accessibility-control">

        <button class="style-btn" id="btn-rainbow" onclick="changeIndentStyle('rainbow')" title="Rainbow Tracks">🌈</button>
        <button class="style-btn" id="btn-snakes" onclick="changeIndentStyle('snakes')" title="Python Snakes">🐍</button>

    <h3>Font Size</h3>

        <button class="accessibility-scale" onclick="adjustFontSize(1)">Increase</button>
        <button class="accessibility-scale" onclick="adjustFontSize(-1)">Decrease</button>

</div>

<!-- Main App Container -->
<div id="mainContainer">
    <h1 class="page-title">Classroom Python IDE</h1>

    <div class="ide-container">
        <div class="editor-container" id="editorContainer">
            <div class="ide-toolbar" id="editorToolbar">
                <span>Python Workspace</span>
                <div class="ide-toolbar-buttons">
                    <button class="ide-btn" id="btnUndo" onclick="editor.undo()">Undo</button>
                    <button class="ide-btn" id="btnRedo" onclick="editor.redo()">Redo</button>
                </div>
            </div>
            <textarea id="code"></textarea>
        </div>

        <div class="output-container" id="outputContainer">
            <div class="ide-toolbar" id="outputToolbar">
                <span>Execution Terminal</span>
                <button class="btn-run" onclick="runPython()">Run Code</button>
            </div>
            <pre id="output">Terminal ready...</pre>
        </div>
    </div>
</div>

<footer>
    <p>Mx Brooke's Education Resources. Copy, Use and Modify as you Wish.</p>
</footer>

<script>
// --- Background Decorative Hexagon Generator ---
function generateBackgroundHexagons() {
    const container = document.getElementById('bgHexagonsContainer');
    const palette = ['#E69A10', '#4A3E32', '#3D3227', '#6B5B4E'];
    const count = 9;

    for (let i = 0; i < count; i++) {
        const hex = document.createElement('div');
        hex.className = 'bg-hex';

        const size = Math.floor(Math.random() * 160) + 110;
        hex.style.width = size + 'px';
        hex.style.height = (size * 1.15) + 'px';

        const topPos = Math.random() * 88;
        const leftPos = Math.random() * 92;
        hex.style.top = topPos + '%';
        hex.style.left = leftPos + '%';

        const rotation = Math.random() * 60 - 30;
        const opacity = (Math.random() * 0.12 + 0.08).toFixed(2);
        hex.style.transform = `rotate(${rotation}deg)`;
        hex.style.opacity = opacity;

        const color = palette[Math.floor(Math.random() * palette.length)];

        hex.innerHTML = `<svg viewBox="0 0 100 100"><polygon points="25,5 75,5 95,50 75,95 25,95 5,50" stroke="${color}" /></svg>`;
        container.appendChild(hex);
    }
}

// --- Background Swarming Bees Canvas ---
let stitchParticles = [];
let mouseX = -1000;
let mouseY = -1000;

window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

window.addEventListener('mouseleave', () => {
    mouseX = -1000;
    mouseY = -1000;
});

const logoImage = new Image();
logoImage.src = 'https://www.mxbrooke.co.uk/images/logo.svg';

class StitchParticle {
    constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.length = 9; 
        this.maxLife = 320; 
        this.life = this.maxLife;
    }

    update() {
        this.life--;
    }

    draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife) * 0.4;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.beginPath();
        ctx.moveTo(-this.length / 2, 0);
        ctx.lineTo(this.length / 2, 0);

        ctx.strokeStyle = `rgba(74, 62, 50, ${alpha})`;
        ctx.lineWidth = 2.0;
        ctx.lineCap = 'square';
        ctx.stroke();

        ctx.restore();
    }
}

class FlyingLogoBee {
    constructor(canvasWidth, canvasHeight) {
        this.reset(canvasWidth, canvasHeight);
    }

    reset(w, h) {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.targetSize = 32; 
        this.angle = Math.random() * Math.PI * 2;
        this.distanceSinceLastStitch = 0;
        this.stitchInterval = 26;
    }

    update(w, h) {
        const oldX = this.x;
        const oldY = this.y;

        const dx = mouseX - this.x;
        const dy = mouseY - this.y;
        const distToCursor = Math.hypot(dx, dy);
        const attractionRadius = 240;

        if (distToCursor < attractionRadius && distToCursor > 25) {
            const angleToCursor = Math.atan2(dy, dx);
            this.vx += Math.cos(angleToCursor) * 0.12;
            this.vy += Math.sin(angleToCursor) * 0.12;
        } else {
            this.angle += (Math.random() - 0.5) * 0.2;
            this.vx += Math.cos(this.angle) * 0.08;
            this.vy += Math.sin(this.angle) * 0.08;
        }

        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        const maxSpeed = 1.95;
        if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < -40) this.x = w + 40;
        if (this.x > w + 40) this.x = -40;
        if (this.y < -40) this.y = h + 40;
        if (this.y > h + 40) this.y = -40;

        const distMoved = Math.hypot(this.x - oldX, this.y - oldY);
        this.distanceSinceLastStitch += distMoved;

        if (this.distanceSinceLastStitch >= this.stitchInterval) {
            this.distanceSinceLastStitch = 0;
            const flightAngle = Math.atan2(this.vy, this.vx);
            
            const offset = this.targetSize * 0.45;
            const trailX = this.x - Math.cos(flightAngle) * offset;
            const trailY = this.y - Math.sin(flightAngle) * offset;

            stitchParticles.push(new StitchParticle(trailX, trailY, flightAngle));
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const flightAngle = Math.atan2(this.vy, this.vx);
        const rotationOffset = Math.PI / 2;
        const wiggle = Math.sin(Date.now() * 0.01) * 0.08;
        ctx.rotate(flightAngle + rotationOffset + wiggle);

        ctx.beginPath();
        ctx.arc(0, 0, this.targetSize * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(230, 154, 16, 0.12)";
        ctx.fill();

        if (logoImage.complete && logoImage.naturalWidth > 0 && logoImage.naturalHeight > 0) {
            const aspect = logoImage.naturalWidth / logoImage.naturalHeight;
            let drawWidth = this.targetSize;
            let drawHeight = this.targetSize;

            if (aspect > 1) {
                drawHeight = this.targetSize / aspect;
            } else {
                drawWidth = this.targetSize * aspect;
            }

            ctx.drawImage(logoImage, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        } else {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 3) * i;
                const hx = Math.cos(a) * (this.targetSize / 2);
                const hy = Math.sin(a) * (this.targetSize / 2);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.fillStyle = "#E69A10";
            ctx.fill();
            ctx.strokeStyle = "#4A3E32";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.restore();
    }
}

const canvas = document.getElementById('beeCanvas');
const ctx = canvas.getContext('2d');
let bees = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function initBees() {
    resizeCanvas();
    bees = [];
    stitchParticles = [];
    const count = Math.min(9, Math.max(4, Math.floor(window.innerWidth / 220)));
    for (let i = 0; i < count; i++) {
        bees.push(new FlyingLogoBee(canvas.width, canvas.height));
    }
}

function animateBees() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = stitchParticles.length - 1; i >= 0; i--) {
        const p = stitchParticles[i];
        p.update();
        if (p.life <= 0) {
            stitchParticles.splice(i, 1);
        } else {
            p.draw(ctx);
        }
    }

    bees.forEach(bee => {
        bee.update(canvas.width, canvas.height);
        bee.draw(ctx);
    });

    requestAnimationFrame(animateBees);
}

function createSnakeSVG(totalIndents, charWidth, isDead) {
    const tabWidth = 4 * charWidth;
    const totalPx = totalIndents * tabWidth;
    const headX = Math.max(10, totalPx - 8);
    const snakeColor = isDead ? "#95a5a6" : "#2ecc71";
    
    let pathD = `M 0,12 `;
    
    if (isDead) {
        pathD += `L ${headX},12`;
    } else {
        for(let i = 0; i < totalIndents; i++) {
            let startX = i * tabWidth;
            let qX = startX + tabWidth / 4;
            let mX = startX + tabWidth / 2;
            let endX = startX + tabWidth;
            if (i === totalIndents - 1) endX = headX;
            pathD += `Q ${qX},4 ${mX},12 T ${endX},12 `;
        }
    }

    const eyeX = headX + 1;
    const eyes = isDead 
        ? `<text x="${eyeX - 4}" y="16" font-family="sans-serif" font-size="10" fill="black" font-weight="bold">x</text>`
        : `<circle cx="${eyeX}" cy="9" r="1.5" fill="black"/><circle cx="${eyeX}" cy="15" r="1.5" fill="black"/><path d="M${headX+4},12 L${headX+10},10 M${headX+4},12 L${headX+10},14" stroke="red" stroke-width="1.5" fill="none"/>`;

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalPx}" height="24">
        <path d="${pathD}" stroke="${snakeColor}" fill="none" stroke-width="5" stroke-linecap="round"/>
        <circle cx="${headX}" cy="12" r="6" fill="${snakeColor}"/>
        ${eyes}
    </svg>`;
    
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

// --- 2. Dynamic Adaptive Indentation Render Engine (Pixel Perfect) ---
editor.on("renderLine", function(cm, lineHandle, el) {
    const text = lineHandle.text;
    const match = text.match(/^([ \t]+)/);
    
    el.style.backgroundImage = "none";
    el.style.backgroundRepeat = "no-repeat";
    el.style.backgroundColor = "transparent";

    const currentStyle = localStorage.getItem('indentStyle') || 'greenpink';

    if (!match || match[0].length === 0) return;

    const whitespace = match[0];
    const isInvalid = whitespace.includes('\t') || (whitespace.length % 4 !== 0);
    
    const charWidth = cm.defaultCharWidth();
    const totalPx = whitespace.length * charWidth;
    const pad = 4;

    if (currentStyle === 'snakes') {
        const totalIndents = whitespace.length / 4;
        const svgUri = createSnakeSVG(totalIndents, charWidth, isInvalid);
        el.style.backgroundImage = `url("${svgUri}")`;
        el.style.backgroundPosition = `${pad}px center`;
        el.style.backgroundSize = `${totalPx}px 100%`;
        if (isInvalid) el.style.backgroundColor = "rgba(232, 67, 147, 0.85)";
        return;
    }

    if (isInvalid) {
        el.style.backgroundImage = `linear-gradient(to right, rgba(255, 0, 167, 0.15) ${pad}px, rgba(232, 67, 147, 0.85) ${pad + totalPx}px, transparent ${pad + totalPx}px)`;
        el.style.backgroundSize = "100% 100%";
        return;
    }

    const totalIndents = whitespace.length / 4;
    let gradientParts = [];
    
    if (currentStyle === 'greenpink') {
        const greenTokens = ['var(--g1)', 'var(--g2)', 'var(--g3)', 'var(--g4)', 'var(--g5)'];
        for (let step = 0; step < totalIndents; step++) {
            const activeColor = greenTokens[step % 5];
            const startPx = pad + (step * 4 * charWidth);
            const endPx = pad + ((step + 1) * 4 * charWidth);
            
            gradientParts.push(`${activeColor} ${startPx}px`);
            gradientParts.push(`${activeColor} ${endPx}px`);
        }
    } else {
        const colorTokens = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
        for (let step = 0; step < totalIndents; step++) {
            const activeColor = colorTokens[step % 5]; 
            const startPx = pad + (step * 4 * charWidth);
            const endPx = pad + ((step + 1) * 4 * charWidth);
            
            gradientParts.push(`${activeColor} ${startPx}px`);
            gradientParts.push(`${activeColor} ${endPx}px`);
        }
    }
    
    let linesOverlayGradients = [];
    for (let step = 0; step <= totalIndents; step++) {
        const linePx = pad + (step * 4 * charWidth);
        linesOverlayGradients.push(`transparent ${linePx}px`);
        linesOverlayGradients.push(`var(--guide-color) ${linePx}px`);
        linesOverlayGradients.push(`var(--guide-color) ${linePx + 1}px`);
        linesOverlayGradients.push(`transparent ${linePx + 1}px`);
    }

    gradientParts.push(`transparent ${pad + totalPx}px`);
    linesOverlayGradients.push(`transparent ${pad + totalPx}px`);
    
    el.style.backgroundImage = `linear-gradient(to right, ${gradientParts.join(', ')}), linear-gradient(to right, ${linesOverlayGradients.join(', ')})`;
    el.style.backgroundSize = "100% 100%";
});

function darkenColor(hex, percent) {
    hex = hex.replace('#','');
    let r=parseInt(hex.substring(0,2),16);
    let g=parseInt(hex.substring(2,4),16);
    let b=parseInt(hex.substring(4,6),16);
    r=Math.floor(r*(1-percent/100));
    g=Math.floor(g*(1-percent/100));
    b=Math.floor(b*(1-percent/100));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

// --- 5. Guided Error Parser Framework featuring Byte the Robot ---
function generateRobotError(errorObj, fullCode) {
    const rawMessage = errorObj.toString();
    let lineNum = null;
    
    if (errorObj.traceback && errorObj.traceback.length > 0) {
        lineNum = errorObj.traceback[0].lineno;
    } else if (errorObj.lineno) {
        lineNum = errorObj.lineno;
    }

    if (!lineNum) {
        const lineMatch = rawMessage.match(/on line (\d+)/i);
        if (lineMatch) lineNum = parseInt(lineMatch[1]);
    }

    let friendlyExplanation = "Take a close look at this line to see if something is missing or typed wrong!";
    let missingSymbol = null;
    let targetLineNum = lineNum || 1;
    const lines = fullCode.split('\n');

    if (rawMessage.includes("SyntaxError") || rawMessage.includes("ParseError")) {
        let linesToScan = [targetLineNum];
        
        if (targetLineNum > 1) linesToScan.push(targetLineNum - 1);
        if (targetLineNum > 2) linesToScan.push(targetLineNum - 2);

        for (let lNum of linesToScan) {
            let txt = lines[lNum - 1] || "";
            let trimmed = txt.trim();
            
            if (trimmed === "" || trimmed.startsWith("#")) continue;

            let openPars = (txt.match(/\(/g) || []).length;
            let closePars = (txt.match(/\)/g) || []).length;
            let openSq = (txt.match(/\[/g) || []).length;
            let closeSq = (txt.match(/\]/g) || []).length;
            let doubleQuotesCount = (txt.match(/"/g) || []).length;
            let singleQuotesCount = (txt.match(/'/g) || []).length;

            if (/^(if\b|elif\b|while\b)/.test(trimmed) && trimmed.includes('=') && !trimmed.includes('==') && !trimmed.includes('!=') && !trimmed.includes('<=\b') && !trimmed.includes('>=\b')) {
                missingSymbol = "==";
                targetLineNum = lNum;
                friendlyExplanation = "<strong>Using assignment instead of comparison!</strong><br><ul class='guide-list'><li>When checking if a variable equals something in a conditional statement, you must use double equals <code>==</code> instead of a single equal <code>=</code>!</li></ul>";
                break;
            }

            if (/^(if\b|def\b|for\b|while\b|elif\b|else\b)/.test(trimmed)) {
                if (!trimmed.endsWith(":")) {
                    missingSymbol = "Colon (:)";
                    targetLineNum = lNum;
                    friendlyExplanation = "<strong>Missing a colon!</strong><br><ul class='guide-list'><li>Your block instruction needs a colon <code>:</code> right at the end of the line!</li></ul>";
                    break;
                }
            }

            if (openPars > closePars) {
                missingSymbol = "Bracket )";
                targetLineNum = lNum;
                friendlyExplanation = "<strong>Missing a closing bracket!</strong><br><ul class='guide-list'><li>Ensure every opening bracket has a closing partner!</li></ul>";
                break;
            } 
            else if (closePars > openPars) {
                missingSymbol = "Bracket (";
                targetLineNum = lNum;
                friendlyExplanation = "<strong>Too many closing brackets!</strong><br><ul class='guide-list'><li>You have a closing bracket <code>)</code> on this line that doesn't have an opening partner.</li></ul>";
                break;
            } 
            else if (openSq > closeSq) {
                missingSymbol = "Bracket ]";
                targetLineNum = lNum;
                friendlyExplanation = "<strong>Missing a square bracket!</strong><br><ul class='guide-list'><li>Make sure your collections or lists are closed with a <code>]</code>.</li></ul>";
                break;
            } 
            else if (doubleQuotesCount % 2 !== 0) {
                missingSymbol = 'Speech Mark "';
                targetLineNum = lNum;
                friendlyExplanation = "<strong>Unfinished double speech marks!</strong><br><ul class='guide-list'><li>Make sure they always come in pairs on the same line!</li></ul>";
                break;
            } else if (singleQuotesCount % 2 !== 0) {
                missingSymbol = "Speech Mark '";
                targetLineNum = lNum;
                friendlyExplanation = "<strong>Unfinished single speech marks!</strong><br><ul class='guide-list'><li>Make sure they always come in pairs on the same line!</li></ul>";
                break;
            }
        }
    } else if (rawMessage.includes("IndentationError")) {
        friendlyExplanation = "<strong>Spacing or Tab mistake!</strong><br><ul class='guide-list'><li>The code under your loop or function block needs to be pushed forward uniformly. Check your spaces!</li></ul>";
    } else if (rawMessage.includes("NameError")) {
        const varMatch = rawMessage.match(/name '([^']+)' is not defined/);
        const varName = varMatch ? varMatch[1] : "word";
        friendlyExplanation = `<strong>Spelling mistake or missing variable!</strong><br><ul class='guide-list'><li>Python doesn't know what <code>${varName}</code> means. Remember that spelling and capitals matter!</li></ul>`;
    } else if (rawMessage.includes("TypeError")) {
        friendlyExplanation = `<strong>Data Type Mistake (TypeError)!</strong><br><ul class='guide-list'><li>You are matching data types that do not mix well together. For example, trying to add numbers and strings, or passing the wrong data structure type to a function. Check your values!</li></ul>`;
    }

    if (targetLineNum) {
        currentErrorLineHandle = editor.addLineClass(targetLineNum - 1, "background", "error-line-highlight");
    }

    let brokenLineText = lines[targetLineNum - 1] || "";

    if (targetLineNum && missingSymbol) {
        let promptBox = document.getElementById("floatingLinePrompt");
        if (!promptBox) {
            promptBox = document.createElement("div");
            promptBox.id = "floatingLinePrompt";
            promptBox.className = "floating-line-prompt";
            editor.getWrapperElement().querySelector('.CodeMirror-lines').appendChild(promptBox);
        }
        
        const coord = editor.charCoords({line: targetLineNum - 1, ch: brokenLineText.length}, "local");
        promptBox.innerHTML = `Fix ${missingSymbol}`;
        promptBox.style.left = (coord.left + 40) + "px"; 
        promptBox.style.top = coord.top + "px";
        promptBox.style.display = "block";
    }

    let codeSnippetHtml = "";
    if (targetLineNum && brokenLineText) {
        codeSnippetHtml = `<div class="error-pointer">Line ${targetLineNum}: <span class="highlight-line">${escapeHtml(brokenLineText)}</span></div>`;
    }

    return `
        <div class="robot-error-box">
            <div class="robot-mascot">🤖</div>
            <div class="error-details">
                <h4>Error Message</h4>
                <p>Oops! I found an issue on <strong>Line ${targetLineNum}</strong>.<br><br>${friendlyExplanation}</p>
                ${codeSnippetHtml}
            </div>
        </div>`;
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function outf(text) { 
    const outBox = document.getElementById("output");
    if (text !== "\n") { outBox.innerHTML += escapeHtml(text); }
}

function builtinRead(x) {
    if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
        throw "File not found: '" + x + "'";
    return Sk.builtinFiles["files"][x];
}

function terminalInputHandler(promptText) {
    if (promptText) { outf(promptText); }
    return new Promise((resolve) => {
        const outBox = document.getElementById("output");
        const inputEl = document.createElement("input");
        inputEl.type = "text";
        inputEl.className = "terminal-input";
        outBox.appendChild(inputEl);
        inputEl.focus();

        inputEl.addEventListener("input", () => {
            inputEl.style.width = Math.max(inputEl.value.length + 1, 2) + "ch";
        });

        inputEl.addEventListener("keydown", function handleEnter(e) {
            if (e.key === "Enter") {
                const resultValue = inputEl.value;
                inputEl.removeEventListener("keydown", handleEnter);
                inputEl.remove();
                outBox.innerHTML += escapeHtml(resultValue) + "\n";
                resolve(resultValue);
            }
        });
    });
}

// --- 6. Code Execution Pipeline Engine ---
function runPython() {
    if (currentErrorLineHandle) {
        editor.removeLineClass(currentErrorLineHandle, "background", "error-line-highlight");
        currentErrorLineHandle = null;
    }
    const promptBox = document.getElementById("floatingLinePrompt");
    if (promptBox) promptBox.style.display = "none";

    const code = editor.getValue();
    const outputBox = document.getElementById("output");
    
    outputBox.innerHTML = ""; 
    Sk.pre = "output";
    
    Sk.configure({ 
        output: outf, 
        read: builtinRead,
        inputfun: terminalInputHandler,
        __future__: Sk.python3 
    }); 

    const myPromise = Sk.misceval.asyncToPromise(function() {
        return Sk.importMainWithBody("<stdin>", false, code, true);
    });

    myPromise.then(function() {
        // Success
    }, function(err) {
        outputBox.innerHTML += generateRobotError(err, code);
    });
}

function exportFile() {
    const codeContent = editor.getValue();
    const blob = new Blob([codeContent], { type: "text/plain;charset=utf-8" });
    const virtualLink = document.createElement("a");
    
    virtualLink.download = "my_script.py";
    virtualLink.href = window.URL.createObjectURL(blob);
    virtualLink.style.display = "none";
    
    document.body.appendChild(virtualLink);
    virtualLink.click();
    document.body.removeChild(virtualLink);
}

window.onload = function(){
    generateBackgroundHexagons();
    initBees();
    animateBees();

    const saved = localStorage.getItem('bgColor') || 'white';
    setBackground(saved);

    const savedIndentStyle = localStorage.getItem('indentStyle') || 'greenpink';
    changeIndentStyle(savedIndentStyle);

    const ws = parseFloat(localStorage.getItem('wordSpacing')||'0');
    const fs = parseFloat(localStorage.getItem('fontSize')||'16');
    
    document.body.style.wordSpacing = ws + 'em';
    document.documentElement.style.setProperty('--editor-ls', (ws * 0.4) + 'em');
    
    document.body.style.fontSize = fs + 'px';
    document.documentElement.style.setProperty('--editor-fs', fs + 'px');

    setTimeout(fixEditorLayout, 200);
};

window.addEventListener('resize', () => { 
    resizeCanvas();
    setTimeout(fixEditorLayout, 50); 
});

window.addEventListener('click', function(e){
    const panel = document.getElementById('accessPanel');
    if (!panel.contains(e.target) && !e.target.closest('.accessibility-toggle')) {
        panel.classList.remove('open');
    }
});
</script>

</body>
</html>
