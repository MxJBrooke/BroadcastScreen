<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games - Mx Brooke's Education Resources</title>

<!-- Poppins Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-main: #FFF4E6;
    --header-bg: #4A3E32;
    --accent-amber: #E69A10;
    --accent-hover: #C5830D;
    --text-dark: #2C241D;
    --text-muted: #6B5B4E;
    --card-bg: #FFFFFF;
    --card-border: #F0D5B7;
    
    /* Hexagon & Angular Cutouts */
    --hex-cut-sm: polygon(8px 0%, calc(100% - 8px) 0%, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0% calc(100% - 8px), 0% 8px);
    --hex-cut-md: polygon(14px 0%, calc(100% - 14px) 0%, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0% calc(100% - 14px), 0% 14px);
    --hex-cut-lg: polygon(22px 0%, calc(100% - 22px) 0%, 100% 22px, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0% calc(100% - 22px), 0% 22px);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-main);
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
}

/* Dynamically Generated Background Hollow SVG Hexagons */
.bg-hexagons {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.bg-hex {
    position: absolute;
    background: transparent;
}

.bg-hex svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke-width: 4px;
    stroke-linejoin: round;
}

/* Background Canvas for Interactive Swarming Bee Trails */
#beeCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 2;
}

/* Header Component */
.header {
    width: 100%;
    height: 80px;
    background-color: var(--header-bg);
    border-bottom: 3px solid #3D3227;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.brand-section {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
    text-decoration: none;
}

.brand-section img.logo {
    height: 52px;
    width: auto;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.brand-section:hover img.logo {
    transform: scale(1.08) rotate(-3deg);
}

.brand-title {
    color: #FFFFFF;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.brand-title::after {
    content: "⬡";
    color: var(--accent-amber);
    font-size: 1.3rem;
}

/* Main Content Wrapper */
#mainContainer {
    margin-top: 120px;
    width: 92%;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
    flex-grow: 1;
    position: relative;
    z-index: 10;
    padding-bottom: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.page-title {
    font-size: 2.25rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: center;
}

.page-title::before, .page-title::after {
    content: "⬡";
    color: var(--accent-amber);
    font-size: 1.8rem;
}

/* Dynamic Dynamic Fluid Grid */
#buttonGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px;
    width: 100%;
}

/* Angular Chamfered Project Card Buttons */
.projectButton {
    background-color: var(--header-bg);
    color: #FFFFFF;
    border: none;
    padding: 36px 24px;
    font-family: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    clip-path: var(--hex-cut-md);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 130px;
    position: relative;
    box-shadow: 0 6px 16px rgba(74, 62, 50, 0.12);
    transition: background-color 0.25s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.25s ease, box-shadow 0.25s ease;
    line-height: 1.35;
}

.projectButton:hover {
    background-color: var(--accent-amber);
    color: #2C241D;
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(230, 154, 16, 0.25);
}

.projectButton:active {
    transform: translateY(-2px);
}

/* Footer Section */
footer {
    text-align: center;
    padding: 24px;
    font-size: 0.88rem;
    color: var(--text-muted);
    border-top: 1px solid var(--card-border);
    position: relative;
    z-index: 10;
    margin-top: auto;
}

/* Responsive Scaling */
@media (max-width: 640px) {
    .header {
        height: 70px;
    }
    .brand-section img.logo {
        height: 42px;
    }
    .brand-title {
        font-size: 1.05rem;
    }
    #mainContainer {
        margin-top: 105px;
        width: 90%;
    }
    .page-title {
        font-size: 1.75rem;
        margin-bottom: 24px;
    }
    #buttonGrid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 18px;
    }
    .projectButton {
        padding: 24px 16px;
        font-size: 1rem;
        min-height: 100px;
    }
}
</style>
</head>

<body>

<!-- Background Dynamic Hexagons Container -->
<div class="bg-hexagons" id="bgHexagonsContainer"></div>

<!-- Background Interactive Canvas -->
<canvas id="beeCanvas"></canvas>

<!-- Centered Logo Header -->
<header class="header">
    <a href="https://www.mxbrooke.co.uk/" class="brand-section" title="Mx Brooke's Education Resources">
        <img src="https://www.mxbrooke.co.uk/images/logo.svg" alt="MXB Logo" class="logo">
        <span class="brand-title">MxBrooke.co.uk</span>
    </a>
</header>

<!-- Main Container -->
<div id="mainContainer">
    <h1 class="page-title">Games</h1>

    <div id="buttonGrid">
        <button class="projectButton" onclick="location.href='binaryhero/'">
            Binary Hero
        </button>
        <button class="projectButton" onclick="location.href='hexhero/'">
            Hexadecimal Hero
        </button>
        <button class="projectButton" onclick="location.href='logicswarm/'">
            Logic Swarm
        </button>
        <button class="projectButton" onclick="location.href='pythondefuse/'">
            Python Defusal
        </button>
    </div>
</div>

<footer>
    <p>Mx Brooke's Education Resources. Copy, Use and Modify as you Wish.</p>
</footer>

<script>
// Generate Random Background Hexagons on Load
function generateBackgroundHexagons() {
    const container = document.getElementById('bgHexagonsContainer');
    const palette = ['#E69A10', '#4A3E32', '#3D3227', '#6B5B4E'];
    const count = 9;

    for (let i = 0; i < count; i++) {
        const hex = document.createElement('div');
        hex.className = 'bg-hex';

        const size = Math.floor(Math.random() * 160) + 110;
        hex.style.width = size + 'px';
        hex.style.height = (size * 1.15) + 'px';

        const topPos = Math.random() * 88;
        const leftPos = Math.random() * 92;
        hex.style.top = topPos + '%';
        hex.style.left = leftPos + '%';

        const rotation = Math.random() * 60 - 30;
        const opacity = (Math.random() * 0.12 + 0.08).toFixed(2);
        hex.style.transform = `rotate(${rotation}deg)`;
        hex.style.opacity = opacity;

        const color = palette[Math.floor(Math.random() * palette.length)];

        hex.innerHTML = `<svg viewBox="0 0 100 100"><polygon points="25,5 75,5 95,50 75,95 25,95 5,50" stroke="${color}" /></svg>`;
        container.appendChild(hex);
    }
}

/* Interactive Swarming Logo Bees with Stitch Trails */
let stitchParticles = [];
let mouseX = -1000;
let mouseY = -1000;

window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

window.addEventListener('mouseleave', () => {
    mouseX = -1000;
    mouseY = -1000;
});

const logoImage = new Image();
logoImage.src = 'https://www.mxbrooke.co.uk/images/logo.svg';

class StitchParticle {
    constructor(x, y, angle) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.length = 9; 
        this.maxLife = 320; 
        this.life = this.maxLife;
    }

    update() {
        this.life--;
    }

    draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife) * 0.4;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        ctx.beginPath();
        ctx.moveTo(-this.length / 2, 0);
        ctx.lineTo(this.length / 2, 0);

        ctx.strokeStyle = `rgba(74, 62, 50, ${alpha})`;
        ctx.lineWidth = 2.0;
        ctx.lineCap = 'square';
        ctx.stroke();

        ctx.restore();
    }
}

class FlyingLogoBee {
    constructor(canvasWidth, canvasHeight) {
        this.reset(canvasWidth, canvasHeight);
    }

    reset(w, h) {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.targetSize = 32; 
        this.angle = Math.random() * Math.PI * 2;
        this.distanceSinceLastStitch = 0;
        this.stitchInterval = 26;
    }

    update(w, h) {
        const oldX = this.x;
        const oldY = this.y;

        const dx = mouseX - this.x;
        const dy = mouseY - this.y;
        const distToCursor = Math.hypot(dx, dy);
        const attractionRadius = 240;

        if (distToCursor < attractionRadius && distToCursor > 25) {
            const angleToCursor = Math.atan2(dy, dx);
            this.vx += Math.cos(angleToCursor) * 0.12;
            this.vy += Math.sin(angleToCursor) * 0.12;
        } else {
            this.angle += (Math.random() - 0.5) * 0.2;
            this.vx += Math.cos(this.angle) * 0.08;
            this.vy += Math.sin(this.angle) * 0.08;
        }

        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
        const maxSpeed = 1.95;
        if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x < -40) this.x = w + 40;
        if (this.x > w + 40) this.x = -40;
        if (this.y < -40) this.y = h + 40;
        if (this.y > h + 40) this.y = -40;

        const distMoved = Math.hypot(this.x - oldX, this.y - oldY);
        this.distanceSinceLastStitch += distMoved;

        if (this.distanceSinceLastStitch >= this.stitchInterval) {
            this.distanceSinceLastStitch = 0;
            const flightAngle = Math.atan2(this.vy, this.vx);
            
            const offset = this.targetSize * 0.45;
            const trailX = this.x - Math.cos(flightAngle) * offset;
            const trailY = this.y - Math.sin(flightAngle) * offset;

            stitchParticles.push(new StitchParticle(trailX, trailY, flightAngle));
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);

        const flightAngle = Math.atan2(this.vy, this.vx);
        const rotationOffset = Math.PI / 2;
        const wiggle = Math.sin(Date.now() * 0.01) * 0.08;
        ctx.rotate(flightAngle + rotationOffset + wiggle);

        ctx.beginPath();
        ctx.arc(0, 0, this.targetSize * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(230, 154, 16, 0.12)";
        ctx.fill();

        if (logoImage.complete && logoImage.naturalWidth > 0 && logoImage.naturalHeight > 0) {
            const aspect = logoImage.naturalWidth / logoImage.naturalHeight;
            let drawWidth = this.targetSize;
            let drawHeight = this.targetSize;

            if (aspect > 1) {
                drawHeight = this.targetSize / aspect;
            } else {
                drawWidth = this.targetSize * aspect;
            }

            ctx.drawImage(logoImage, -drawWidth / 2, -drawHeight / 2, drawWidth, drawHeight);
        } else {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 3) * i;
                const hx = Math.cos(a) * (this.targetSize / 2);
                const hy = Math.sin(a) * (this.targetSize / 2);
                if (i === 0) ctx.moveTo(hx, hy);
                else ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.fillStyle = "#E69A10";
            ctx.fill();
            ctx.strokeStyle = "#4A3E32";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.restore();
    }
}

const canvas = document.getElementById('beeCanvas');
const ctx = canvas.getContext('2d');
let bees = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

function initBees() {
    resizeCanvas();
    bees = [];
    stitchParticles = [];
    const count = Math.min(9, Math.max(4, Math.floor(window.innerWidth / 220)));
    for (let i = 0; i < count; i++) {
        bees.push(new FlyingLogoBee(canvas.width, canvas.height));
    }
}

function animateBees() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = stitchParticles.length - 1; i >= 0; i--) {
        const p = stitchParticles[i];
        p.update();
        if (p.life <= 0) {
            stitchParticles.splice(i, 1);
        } else {
            p.draw(ctx);
        }
    }

    bees.forEach(bee => {
        bee.update(canvas.width, canvas.height);
        bee.draw(ctx);
    });

    requestAnimationFrame(animateBees);
}

window.addEventListener('resize', resizeCanvas);

window.onload = function() {
    generateBackgroundHexagons();
    initBees();
    animateBees();
};
</script>

</body>
</html>
