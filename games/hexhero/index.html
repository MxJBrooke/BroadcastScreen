<style>

:root{
    --block-bg:#f5f5f5;
    --text-color:#000;
}

/* BASE */

body{
    margin:0;
    font-family:Consolas, monospace;
    background:#fff;
    color:#000;
    overflow:hidden;
    transition:all 0.3s ease;
    font-size:16px;
    word-spacing:normal;
}

/* HEADER */

.header{
    height:90px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    transition:background 0.3s ease;
}

.header h1{
    margin:0;
    font-size:42px;
}

/* ACCESSIBILITY */

.accessibility-toggle{
    position:absolute;
    left:20px;
    padding:8px 14px;
    border-radius:6px;
    border:1px solid #777;
    background:#fff;
    cursor:pointer;
    font-weight:bold;
}

.accessibility-panel{
    position:fixed;
    top:0;
    left:-260px;
    width:250px;
    height:100%;
    padding:20px;
    box-sizing:border-box;
    background:#fff;
    transition:left 0.3s ease;
    z-index:1000;
    overflow-y:auto;
    border-right:2px solid #aaa;
}

.accessibility-panel.open{
    left:0;
}

.color-spot{
    width:32px;
    height:32px;
    border-radius:50%;
    border:2px solid #777;
    margin:5px;
    cursor:pointer;
}

.accessibility-scale{
    margin:5px 0;
    padding:8px 14px;
    border-radius:6px;
    border:1px solid #777;
    background:#fff;
    cursor:pointer;
    font-weight:bold;
    width:100%;
}

/* BIT SELECTOR */

.bit-selector{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:10px;
    margin-bottom:10px;
}

.bit-selector button{
    width:42px;
    height:42px;
    border-radius:10px;
    border:2px solid currentColor;
    background:#fff;
    font-size:28px;
    cursor:pointer;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:0;
    line-height:1;
}

#startBitDisplay,
#gameBitDisplay{
    font-size:22px;
    font-weight:bold;
    min-width:120px;
    text-align:center;
}

/* HUD */

.hud{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
    flex-wrap:wrap;
}

/* INSTRUCTIONS */

.instructions{
    text-align:center;
    margin-top:8px;
    opacity:0.8;
}

/* LAYOUT */

.layout{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
}

/* GAME BOARD */

.game-board{
    width:500px;
    height:78vh;
    border:4px solid #444;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    background:var(--block-bg);
    transition:background 0.3s ease;
}

/* HIGHSCORES */

.highscores{
    width:240px;
    height:78vh;
    overflow-y:auto;
    border:4px solid #444;
    border-radius:20px;
    background:rgba(255,255,255,0.35);
    padding:15px;
    box-sizing:border-box;
}

.highscore-entry{
    padding:10px;
    border-bottom:1px solid #aaa;
    font-weight:bold;
}

/* LANES */

.lanes{
    position:absolute;
    width:100%;
    height:100%;
    display:grid;
}

.lane{
    border-left:1px solid rgba(0,0,0,0.15);
    border-right:1px solid rgba(0,0,0,0.15);
}

/* HIT LINE */

.hit-line{
    position:absolute;
    bottom:160px;
    width:100%;
    height:6px;
    background:red;
}

/* TARGET BLOCK */

.target-block{
    position:absolute;
    width:180px;
    height:90px;
    left:50%;
    transform:translateX(-50%);
    border-radius:18px;
    background:var(--block-bg);
    color:var(--text-color);
    border:4px solid currentColor;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    font-weight:bold;
    z-index:20;
    transition:background 0.3s ease;
}

/* RELEASED BITS */

.bit{
    position:absolute;
    width:80px;
    height:80px;
    border-radius:14px;
    border:3px solid currentColor;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;
    z-index:15;
    color:#000;
}

.bit:nth-child(odd){
    background:rgba(255,255,255,0.65);
}

.bit:nth-child(even){
    background:rgba(0,0,0,0.08);
}

/* CONTROLS */

.controls{
    position:absolute;
    bottom:40px;
    width:100%;
    display:grid;
}

.key{
    margin:10px;
    height:90px;
    border-radius:16px;
    border:3px solid currentColor;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    background:rgba(255,255,255,0.45);
    transition:all 0.08s ease;
    user-select:none;
}

.key.active{
    background:#000;
    color:#fff;
    transform:scale(0.95);
}

/* OVERLAYS */

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.overlay-box{
    width:340px;
    background:#fff;
    color:#000;
    border-radius:20px;
    padding:30px;
    text-align:center;
    border:4px solid #000;
}

.overlay-box button{
    padding:12px 20px;
    font-size:18px;
    border-radius:10px;
    border:2px solid #000;
    cursor:pointer;
    font-weight:bold;
}

/* FOCUS */

button:focus,
select:focus{
    outline:4px solid #000;
    outline-offset:2px;
}

/* DARK MODE */

body.dark-mode{
    color:#fff;
}

body.dark-mode .game-board,
body.dark-mode .highscores{
    border-color:#999;
}

body.dark-mode .accessibility-panel{
    background:#1a1a1a;
    color:#fff;
}

body.dark-mode .accessibility-toggle,
body.dark-mode .bit-selector button,
body.dark-mode .overlay-box button{
    background:#222;
    color:#fff;
    border-color:#fff;
}

body.dark-mode .overlay-box{
    background:#111;
    color:#fff;
    border-color:#fff;
}

body.dark-mode .key{
    background:rgba(255,255,255,0.08);
}

body.dark-mode .key.active{
    background:#fff;
    color:#000;
}

body.dark-mode .target-block{
    border-color:#fff;
}

body.dark-mode .bit{
    color:#fff;
    border-color:#fff;
}

body.dark-mode .hit-line{
    background:#00ff88;
}

body.dark-mode button:focus{
    outline:4px solid #fff;
}

/* RESPONSIVE */

@media (max-width:900px){

    .layout{
        flex-direction:column;
        align-items:center;
    }

    .highscores{
        width:500px;
        height:220px;
    }
}

@media (max-width:600px){

    .game-board{
        width:95vw;
    }

    .highscores{
        width:95vw;
    }

    .hud{
        gap:15px;
        font-size:16px;
    }

    .key{
        height:70px;
        font-size:20px;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce){

    *{
        transition:none !important;
        animation:none !important;
    }
}

</style>

<body>

<div class="header">

    <button
        class="accessibility-toggle"
        onclick="toggleAccessibility()">

        Accessibility

    </button>

    <h1>Hexadecimal Hero</h1>

</div>

<!-- ACCESSIBILITY -->

<div
    class="accessibility-panel"
    id="accessPanel">

    <button onclick="toggleAccessibility()">
        ✖
    </button>

    <h3>Colours</h3>

    <button
        aria-label="White background"
        class="color-spot"
        style="background:#f5f5f5"
        onclick="setBackground('white')">
    </button>

    <button
        aria-label="Red background"
        class="color-spot"
        style="background:#ffcccc"
        onclick="setBackground('red')">
    </button>

    <button
        aria-label="Orange background"
        class="color-spot"
        style="background:#ffe5cc"
        onclick="setBackground('orange')">
    </button>

    <button
        aria-label="Yellow background"
        class="color-spot"
        style="background:#fff9c4"
        onclick="setBackground('yellow')">
    </button>

    <button
        aria-label="Green background"
        class="color-spot"
        style="background:#e8f5e9"
        onclick="setBackground('green')">
    </button>

    <button
        aria-label="Blue background"
        class="color-spot"
        style="background:#e3f2fd"
        onclick="setBackground('blue')">
    </button>

    <button
        aria-label="Purple background"
        class="color-spot"
        style="background:#e6e0f8"
        onclick="setBackground('purple')">
    </button>

    <button
        aria-label="Pink background"
        class="color-spot"
        style="background:#fce4ec"
        onclick="setBackground('pink')">
    </button>

    <button
        aria-label="Dark background"
        class="color-spot"
        style="background:#121212"
        onclick="setBackground('dark')">
    </button>

    <h3>Word Spacing</h3>

    <button
        class="accessibility-scale"
        onclick="adjustWordSpacing(0.1)">

        Increase

    </button>

    <button
        class="accessibility-scale"
        onclick="adjustWordSpacing(-0.1)">

        Decrease

    </button>

    <h3>Font Size</h3>

    <button
        class="accessibility-scale"
        onclick="adjustFontSize(1)">

        Increase

    </button>

    <button
        class="accessibility-scale"
        onclick="adjustFontSize(-1)">

        Decrease

    </button>

</div>

<!-- HUD -->

<div class="hud">

    <div>
        Score:
        <span id="score">0</span>
    </div>

    <div>
        Lives:
        <span id="lives">3</span>
    </div>

    <div>
        Speed:
        <span id="speed">2.0</span>
    </div>

    <div>
        Block:
        <span id="blockValue">0</span>
    </div>

    <div>
        Binary:
        <span id="binaryDisplay">
            0000
        </span>
    </div>

</div>

<div class="instructions">
    Hold keys to build binary numbers
</div>

<!-- MAIN LAYOUT -->

<div class="layout">

    <!-- GAME -->

    <div
        class="game-board"
        id="board">

        <!-- START -->

        <div
            id="startOverlay"
            class="overlay">

            <div class="overlay-box">

                <h2>
                    Binary Hero
                </h2>

                <p>
                    Hold keys to build binary numbers.
                </p>

                <div class="bit-selector">

                    <button id="startMinusBits">
                        −
                    </button>

                    <span id="startBitDisplay">
                        4 Bits
                    </span>

                    <button id="startPlusBits">
                        +
                    </button>

                </div>

                <button id="startButton">
                    Start Game
                </button>

            </div>

        </div>

        <!-- LANES -->

        <div
            class="lanes"
            id="lanes">
        </div>

        <!-- HIT LINE -->

        <div class="hit-line"></div>

        <!-- CONTROLS -->

        <div
            class="controls"
            id="controls">
        </div>

    </div>

    <!-- HIGHSCORES -->

    <div class="highscores">

        <h2>High Scores</h2>

        <div id="scoreList"></div>

    </div>

</div>

</body>

<script>

/* ACCESSIBILITY */

function toggleAccessibility(){

    document.getElementById(
        "accessPanel"
    ).classList.toggle("open");
}

function adjustWordSpacing(v){

    let c=parseFloat(
        localStorage.getItem("ws") || 0
    );

    c+=v;

    document.body.style.wordSpacing=
        c+"em";

    localStorage.setItem("ws",c);
}

function adjustFontSize(v){

    let c=parseFloat(
        localStorage.getItem("fs") || 16
    );

    c+=v;

    document.body.style.fontSize=
        c+"px";

    localStorage.setItem("fs",c);
}

function darken(hex,amount){

    let col=hex.replace("#","");

    let num=parseInt(col,16);

    let r=Math.max(
        0,
        (num >> 16)-amount
    );

    let g=Math.max(
        0,
        ((num >> 8)&0x00FF)-amount
    );

    let b=Math.max(
        0,
        (num & 0x0000FF)-amount
    );

    return `rgb(${r},${g},${b})`;
}

function setBackground(color){

    const map={
        white:'#f5f5f5',
        red:'#ffcccc',
        orange:'#ffe5cc',
        yellow:'#fff9c4',
        green:'#e8f5e9',
        blue:'#e3f2fd',
        purple:'#e6e0f8',
        pink:'#fce4ec',
        dark:'#121212'
    };

    const bg=map[color];

    const darkMode=
        color==="dark";

    document.body.style.background=bg;

    document.body.style.color=
        darkMode ? "#fff" : "#000";

    document.documentElement
        .style.setProperty(
            "--block-bg",
            bg
        );

    document.documentElement
        .style.setProperty(
            "--text-color",
            darkMode ? "#fff" : "#000"
        );

    document.querySelector(".header")
        .style.background=
            darkMode
                ? "#ffffff"
                : darken(bg,40);

    document.querySelector(".header")
        .style.color=
            darkMode ? "#000" : "#000";

    if(darkMode){

        document.body.classList.add(
            "dark-mode"
        );
    }

    else{

        document.body.classList.remove(
            "dark-mode"
        );
    }

    localStorage.setItem(
        "theme",
        color
    );
}

/* GAME */

const board=
    document.getElementById("board");

let score=0;
let lives=3;
let gameSpeed=2;
let speedIncrease=0.15;
let gameRunning=false;

let currentBlock=null;
let missedBlock=null;

let bitCount=4;

let currentBits=[];

let active={};

const keyBindings=[
    "z","x","c","v",
    "b","n","m",",",
    ".","/"
];

/* BIT GENERATION */

function generateBits(){

    currentBits=[];

    for(
        let i=bitCount-1;
        i>=0;
        i--
    ){

        currentBits.push(
            2**i
        );
    }
}

function rebuildActive(){

    active={};

    currentBits.forEach(bit=>{

        active[bit]=false;
    });
}

function buildControls(){

    const controls=
        document.getElementById(
            "controls"
        );

    controls.innerHTML="";

    controls.style.gridTemplateColumns=
        `repeat(${bitCount},1fr)`;

    currentBits.forEach(
        (bit,index)=>{

        const key=
            document.createElement("div");

        key.className="key";

        key.id="k"+bit;

        key.innerHTML=`
            ${keyBindings[index]
                .toUpperCase()}
            <div>${bit}</div>
        `;

        controls.appendChild(key);
    });
}

function buildLanes(){

    const lanes=
        document.getElementById(
            "lanes"
        );

    lanes.innerHTML="";

    lanes.style.gridTemplateColumns=
        `repeat(${bitCount},1fr)`;

    for(
        let i=0;
        i<bitCount;
        i++
    ){

        const lane=
            document.createElement("div");

        lane.className="lane";

        lanes.appendChild(lane);
    }
}

function rebuildGameBits(){

    generateBits();

    rebuildActive();

    buildControls();

    buildLanes();

    updateBinaryDisplay();
}

function syncBitDisplays(){

    const text=
        `${bitCount} Bits`;

    const ids=[
        "startBitDisplay",
        "gameBitDisplay"
    ];

    ids.forEach(id=>{

        const el=
            document.getElementById(id);

        if(el){

            el.textContent=text;
        }
    });
}

/* BIT BUTTONS */

function increaseBits(){

    if(bitCount>=10) return;

    bitCount++;

    rebuildGameBits();

    syncBitDisplays();
}

function decreaseBits(){

    if(bitCount<=1) return;

    bitCount--;

    rebuildGameBits();

    syncBitDisplays();
}

document.getElementById(
    "startPlusBits"
).onclick=increaseBits;

document.getElementById(
    "startMinusBits"
).onclick=decreaseBits;

/* BLOCK */

function makeBlock(){

    if(
        currentBlock
        &&
        currentBlock.el
    ){

        currentBlock.el.remove();
    }

    const maxValue=
        currentBits.reduce(
            (a,b)=>a+b,
            0
        );

    const value=
        Math.floor(
            Math.random()*maxValue
        )+1;

    const el=
        document.createElement("div");

    el.className="target-block";

    /* DISPLAY AS HEXADECIMAL */

    el.textContent=
        value
            .toString(16)
            .toUpperCase();

    board.appendChild(el);

    currentBlock={

        value:value,

        y:-100,

        speed:gameSpeed,

        paused:false,

        failed:false,

        points:
            bitCount*25,

        el:el
    };

    document.getElementById(
        "blockValue"
    ).textContent=
        Math.floor(
            currentBlock.points
        );
}
/* INPUT */

function getCurrentInput(){

    let total=0;

    for(let b in active){

        if(active[b]){

            total+=Number(b);
        }
    }

    return total;
}

function updateBinaryDisplay(){

    let output=
        currentBits.map(
            b=>active[b]
                ? 1
                : 0
        ).join("");

    document.getElementById(
        "binaryDisplay"
    ).textContent=output;
}

/* GAME LOOP */

let lastTime=0;

function update(timestamp){

    const delta=
        (timestamp-lastTime)/16.67;

    lastTime=timestamp;

    requestAnimationFrame(update);

    if(!gameRunning) return;

    if(!currentBlock) return;

    const hitY=
        board.clientHeight-250;

    if(!currentBlock.paused){

        currentBlock.y+=
            currentBlock.speed
            *delta;
    }

    if(currentBlock.y>=hitY){

        currentBlock.y=hitY;

        if(
            getCurrentInput()===
            currentBlock.value
        ){

            releaseBits(
                currentBlock.value
            );

            score+=Math.floor(
                currentBlock.points
            );

            document.getElementById(
                "score"
            ).textContent=score;

            gameSpeed+=
                speedIncrease;

            document.getElementById(
                "speed"
            ).textContent=
                gameSpeed.toFixed(1);

            currentBlock.el.remove();

            makeBlock();
        }

        else{

            currentBlock.paused=true;

            const pointsDrainPerFrame=
                (
                    bitCount*25
                )/120;

            currentBlock.points-=
                pointsDrainPerFrame
                *delta;

            if(
                currentBlock.points<=0
                &&
                !currentBlock.failed
            ){

                currentBlock.failed=true;

                currentBlock.points=0;

                loseLife();
            }

            document.getElementById(
                "blockValue"
            ).textContent=
                Math.floor(
                    currentBlock.points
                );

            if(
                getCurrentInput()===
                currentBlock.value
            ){

                releaseBits(
                    currentBlock.value
                );

                score+=Math.floor(
                    currentBlock.points
                );

                document.getElementById(
                    "score"
                ).textContent=score;

                gameSpeed+=
                    speedIncrease;

                document.getElementById(
                    "speed"
                ).textContent=
                    gameSpeed.toFixed(1);

                currentBlock.el.remove();

                makeBlock();
            }
        }
    }

    currentBlock.el.style.top=
        currentBlock.y+"px";
}

/* RELEASE BITS */

function releaseBits(value){

    currentBits.forEach(
        (val,index)=>{

        if(value & val){

            const piece=
                document.createElement(
                    "div"
                );

            piece.className=
                "bit";

            piece.textContent=val;

            piece.style.left=
                (
                    (
                        index
                        *
                        (
                            board.clientWidth
                            /bitCount
                        )
                    )
                    +
                    20
                )+"px";

            piece.style.top=
                currentBlock.y+"px";

            board.appendChild(piece);

            let y=currentBlock.y;

            function animate(){

                y+=6;

                piece.style.top=
                    y+"px";

                if(
                    y>
                    board.clientHeight
                ){

                    piece.remove();

                    return;
                }

                requestAnimationFrame(
                    animate
                );
            }

            animate();
        }
    });
}

/* LIFE LOSS */

function loseLife(){

    if(missedBlock){

        missedBlock.remove();
    }

    missedBlock=
        currentBlock.el;

    missedBlock.style.opacity=
        "0.5";

    missedBlock.style.borderColor=
        "red";

    missedBlock.style.top=
        (
            board.clientHeight
            -220
        )+"px";

    lives--;

    if(lives<0){

        lives=0;
    }

    document.getElementById(
        "lives"
    ).textContent=lives;

    if(lives===0){

        gameOver();

        return;
    }

    makeBlock();
}

/* GAME OVER */

function gameOver(){

    gameRunning=false;

    saveHighScore(score);

    const overlay=
        document.createElement("div");

    overlay.className="overlay";

    const box=
        document.createElement("div");

    box.className="overlay-box";

    box.innerHTML=`

        <h2>GAME OVER</h2>

        <div style="
            font-size:30px;
            margin:20px 0;
            font-weight:bold;
        ">
            ${score}
        </div>

        <div class="bit-selector">

            <button id="gameMinusBits">
                −
            </button>

            <span id="gameBitDisplay">
                ${bitCount} Bits
            </span>

            <button id="gamePlusBits">
                +
            </button>

        </div>
    `;

    const btn=
        document.createElement(
            "button"
        );

    btn.textContent=
        "Play Again";

    btn.onclick=()=>{

        overlay.remove();

        resetGame();
    };

    box.appendChild(btn);

    overlay.appendChild(box);

    board.appendChild(overlay);

    document.getElementById(
        "gamePlusBits"
    ).onclick=()=>{

        increaseBits();

        syncBitDisplays();
    };

    document.getElementById(
        "gameMinusBits"
    ).onclick=()=>{

        decreaseBits();

        syncBitDisplays();
    };
}

/* RESET */

function resetGame(){

    score=0;

    lives=3;

    gameSpeed=2;

    document.getElementById(
        "score"
    ).textContent=score;

    document.getElementById(
        "lives"
    ).textContent=lives;

    document.getElementById(
        "speed"
    ).textContent=
        gameSpeed.toFixed(1);

    if(
        currentBlock
        &&
        currentBlock.el
    ){

        currentBlock.el.remove();
    }

    if(missedBlock){

        missedBlock.remove();
    }

    makeBlock();

    gameRunning=true;
}

/* HIGHSCORES */

function saveHighScore(value){

    let scores=JSON.parse(

        localStorage.getItem(
            "binaryHeroScores"
        ) || "[]"
    );

    scores.push(value);

    scores=scores
        .sort((a,b)=>b-a)
        .slice(0,10);

    localStorage.setItem(

        "binaryHeroScores",

        JSON.stringify(scores)
    );

    renderHighScores();
}

function renderHighScores(){

    const list=
        document.getElementById(
            "scoreList"
        );

    list.innerHTML="";

    const scores=JSON.parse(

        localStorage.getItem(
            "binaryHeroScores"
        ) || "[]"
    );

    scores.forEach(
        (score,index)=>{

        const div=
            document.createElement(
                "div"
            );

        div.className=
            "highscore-entry";

        div.textContent=
            `${index+1}. ${score}`;

        list.appendChild(div);
    });
}

/* KEYS */

document.addEventListener(

    "keydown",

    e=>{

    if(e.repeat) return;

    currentBits.forEach(
        (bit,index)=>{

        if(
            e.key===
            keyBindings[index]
        ){

            press(bit);
        }
    });
});

document.addEventListener(

    "keyup",

    e=>{

    currentBits.forEach(
        (bit,index)=>{

        if(
            e.key===
            keyBindings[index]
        ){

            release(bit);
        }
    });
});

function press(bit){

    active[bit]=true;

    const el=
        document.getElementById(
            "k"+bit
        );

    if(el){

        el.classList.add("active");
    }

    updateBinaryDisplay();
}

function release(bit){

    active[bit]=false;

    const el=
        document.getElementById(
            "k"+bit
        );

    if(el){

        el.classList.remove(
            "active"
        );
    }

    updateBinaryDisplay();
}

/* START BUTTON */

document.getElementById(
    "startButton"
).onclick=()=>{

    rebuildGameBits();

    syncBitDisplays();

    document.getElementById(
        "startOverlay"
    ).remove();

    resetGame();
};

/* STARTUP */

window.onload=()=>{

    const fs=
        localStorage.getItem("fs");

    const ws=
        localStorage.getItem("ws");

    const theme=
        localStorage.getItem(
            "theme"
        ) || "white";

    if(fs){

        document.body.style.fontSize=
            fs+"px";
    }

    if(ws){

        document.body.style.wordSpacing=
            ws+"em";
    }

    setBackground(theme);

    rebuildGameBits();

    syncBitDisplays();

    renderHighScores();

    updateBinaryDisplay();

    update();
};

</script>

</body>
</html>
