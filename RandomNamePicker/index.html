<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Picker Fruit Machine - Mx Brooke's Education Resources</title>

<style>
:root {
    --bg-main: #FFF4E6;
    --header-bg: #4A3E32;
    --accent-amber: #E69A10;
    --accent-hover: #C5830D;
    --accent-gold: #E69A10;
    --text-dark: #2C241D;
    --text-muted: #6B5B4E;
    --card-bg: #FFFFFF;
    --card-border: #F0D5B7;
    --dropdown-bg: #3D3227;
    --dropdown-hover: #544638;
    
    /* Hexagon & Angular Clip Paths */
    --hex-cut-sm: polygon(8px 0%, calc(100% - 8px) 0%, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0% calc(100% - 8px), 0% 8px);
    --hex-cut-md: polygon(14px 0%, calc(100% - 14px) 0%, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0% calc(100% - 14px), 0% 14px);
    --hex-cut-lg: polygon(22px 0%, calc(100% - 22px) 0%, 100% 22px, 100% calc(100% - 22px), calc(100% - 22px) 100%, 22px 100%, 0% calc(100% - 22px), 0% 22px);
    
    --confetti-size: 48px;
    --picker-scale: 1;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    position: relative;
    background-image: radial-gradient(var(--card-border) 1px, transparent 1px);
    background-size: 32px 32px;
}

/* Background Hollow Hexagons Container */
.bg-hexagons {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.bg-hex {
    position: absolute;
    background: transparent;
}

.bg-hex svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke-width: 5px;
    stroke-linejoin: round;
}

/* Header & Angular Navigation */
.header {
    width: 100%;
    height: 80px;
    background-color: var(--header-bg);
    border-bottom: 3px solid #3D3227;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 24px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.brand-section {
    display: flex;
    align-items: center;
    gap: 16px;
    justify-self: center;
    grid-column: 2;
}

.brand-section img.logo {
    height: 52px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.brand-section img.logo:hover {
    transform: scale(1.05) rotate(-2deg);
}

.brand-title {
    color: #FFFFFF;
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
}

.brand-title::after {
    content: "⬡";
    color: var(--accent-amber);
    font-size: 1.2rem;
}

#pickStudentHeaderBtn {
    background-color: var(--accent-amber);
    color: #2C241D;
    border: none;
    padding: 10px 20px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: bold;
    clip-path: var(--hex-cut-sm);
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease;
    justify-self: start;
    grid-column: 1;
}

#pickStudentHeaderBtn:hover {
    background-color: var(--accent-hover);
    transform: translateY(-1px);
}

#pickStudentHeaderBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

/* Sidebar */
#sidebar {
    position: fixed;
    top: 80px;
    left: 0;
    width: 260px;
    height: calc(100vh - 80px);
    background: var(--header-bg);
    border-right: 3px solid #3D3227;
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    z-index: 10;
    color: #FFFFFF;
    box-shadow: 4px 0 15px rgba(0,0,0,0.1);
}

#sidebar h2 {
    font-size: 1.1rem;
    margin-bottom: 12px;
    color: var(--accent-amber);
    display: flex;
    align-items: center;
    gap: 8px;
}

#sidebar h2::before {
    content: "⬡";
}

#sidebar textarea,
#sidebar button,
#sidebar input[type="range"] {
    background-color: #3D3227;
    color: #FFFFFF;
    border: 1px solid #6B5B4E;
    padding: 8px;
    margin-bottom: 12px;
    font-family: 'Poppins', sans-serif;
    width: 100%;
    clip-path: var(--hex-cut-sm);
}

#sidebar textarea {
    clip-path: none;
    border-radius: 4px;
    resize: vertical;
}

#sidebar button {
    background-color: var(--accent-amber);
    color: #2C241D;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

#sidebar button:hover {
    background-color: var(--accent-hover);
}

#sidebar label {
    font-size: 0.85rem;
    margin-top: 6px;
    color: #FFE8CF;
    font-weight: 500;
}

/* Sidebar toggle button */
#toggleSidebar {
    position: fixed;
    bottom: 50px;
    left: 260px;
    z-index: 20;
    background: var(--header-bg);
    color: var(--accent-amber);
    border: 2px solid #3D3227;
    padding: 10px 14px;
    cursor: pointer;
    clip-path: var(--hex-cut-sm);
    font-weight: bold;
    transition: left 0.3s ease, background-color 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

#toggleSidebar:hover {
    background-color: #3D3227;
}

/* Main container */
#mainContainer {
    margin-top: 80px;
    margin-left: 260px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    width: calc(100% - 260px);
    transition: margin-left 0.3s ease, width 0.3s ease;
    z-index: 5;
}

/* Background names */
#backgroundNames {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

#backgroundNames div {
    position: absolute;
    font-size: var(--confetti-size);
    white-space: nowrap;
    font-weight: 600;
}

/* Picker spanning from header to footer */
#pickerDisplay {
    height: calc(100vh - 140px);
    border: 3px solid var(--card-border);
    border-radius: 12px;
    background-color: rgba(255, 255, 255, 0.95);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
    transform: scale(var(--picker-scale));
    transform-origin: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    cursor: pointer;
    transition: border-color 0.2s ease;
}

#pickerDisplay:hover {
    border-color: var(--accent-amber);
}

#nameReel {
    position: absolute;
    width: 100%;
    top: 0;
    left: 0;
}

#nameReel div {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 24px;
    transition: color 0.2s, font-size 0.2s, text-shadow 0.2s;
    white-space: nowrap;
}

#nameReel div.current {
    color: var(--text-dark);
    font-size: 48px;
    font-weight: bold;
}

/* Footer for picked students */
#pickedStudentsFooter {
    width: 100%;
    height: 50px;
    overflow-y: auto;
    background-color: var(--header-bg);
    color: #fff;
    border-top: 3px solid #3D3227;
    padding: 8px 20px;
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
}

#pickedStudentsFooter div {
    background-color: var(--accent-amber);
    color: #2C241D;
    padding: 4px 10px;
    clip-path: var(--hex-cut-sm);
    font-weight: bold;
    font-size: 0.85rem;
}

/* Dark mode */
body.dark-mode {
    --bg-main: #1E1813;
    --text-dark: #FFF4E6;
    --text-muted: #BFAEA0;
    --card-bg: #2C241D;
    --card-border: #4A3E32;
    background-image: radial-gradient(#3D3227 1px, transparent 1px);
}

body.dark-mode #pickerDisplay {
    background-color: rgba(44, 36, 29, 0.95);
    border-color: #4A3E32;
}

body.dark-mode #backgroundNames div {
    opacity: 0.35;
    filter: brightness(0.9);
}

body.dark-mode #nameReel div {
    color: #8C7B6E;
}

body.dark-mode #nameReel div.current {
    color: #FFF4E6;
}
</style>
</head>

<body>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Dynamically Generated Random Background Hexagons -->
<div class="bg-hexagons" id="bgHexagonsContainer"></div>

<header class="header">
    <button id="pickStudentHeaderBtn">Pick a Student ⬡</button>

    <div class="brand-section">
        <a href="https://www.mxbrooke.co.uk">
            <img src="https://www.mxbrooke.co.uk/images/logo.svg" alt="MXB Logo" class="logo" title="Mx Brooke's Education Resources">
        </a>
        <a href="https://www.mxbrooke.co.uk" class="brand-title">MxBrooke.co.uk</a>
    </div>

    <div style="justify-self: end; grid-column: 3; display: flex; align-items: center;">
        <button onclick="toggleTheme()" style="background: rgba(0,0,0,0.2); color: #fff; border: none; padding: 8px 14px; clip-path: var(--hex-cut-sm); cursor: pointer; font-family: inherit; font-weight: bold;">Theme</button>
    </div>
</header>

<div id="sidebar">
    <h2>Student Picker</h2>

    <label>Student names</label>
    <textarea id="studentList" rows="8">Alice
Bob
Charlie
Diana
Ethan
Fiona
George
Hannah
Isaac
Julia</textarea>

    <button id="resetListBtn">Reset List</button>

    <label>Picker zoom</label>
    <input id="pickerZoom" type="range" min="0.6" max="1.4" step="0.05" value="1">

    <label>Name confetti size</label>
    <input id="confettiSize" type="range" min="24" max="72" step="2" value="48">
</div>

<button id="toggleSidebar">☰</button>

<div id="mainContainer">
    <div id="backgroundNames"></div>
    <div id="pickerDisplay" title="Click to pick a student!">
        <div id="nameReel"></div>
    </div>
</div>

<!-- Footer for picked students -->
<div id="pickedStudentsFooter"></div>

<script>
// Randomly Generate Background Hexagons on Load
function generateBackgroundHexagons() {
    const container = document.getElementById('bgHexagonsContainer');
    const palette = ['#E69A10', '#4A3E32', '#3D3227', '#6B5B4E'];
    const count = 7;

    for (let i = 0; i < count; i++) {
        const hex = document.createElement('div');
        hex.className = 'bg-hex';

        const size = Math.floor(Math.random() * 160) + 120;
        hex.style.width = size + 'px';
        hex.style.height = (size * 1.14) + 'px';

        const topPos = Math.random() * 85;
        const leftPos = Math.random() * 90;
        hex.style.top = topPos + '%';
        hex.style.left = leftPos + '%';

        const rotation = Math.random() * 60 - 30;
        const opacity = (Math.random() * 0.15 + 0.08).toFixed(2);
        hex.style.transform = `rotate(${rotation}deg)`;
        hex.style.opacity = opacity;

        const color = palette[Math.floor(Math.random() * palette.length)];
        hex.innerHTML = `<svg viewBox="0 0 100 100"><polygon points="25,5 75,5 95,50 75,95 25,95 5,50" stroke="${color}" /></svg>`;
        container.appendChild(hex);
    }
}

function toggleTheme() {
    document.body.classList.toggle('dark-mode');
}

/* Sidebar toggle */
const sidebar = document.getElementById('sidebar');
const mainContainer = document.getElementById('mainContainer');
const toggleBtn = document.getElementById('toggleSidebar');

toggleBtn.onclick = () => {
    const hidden = sidebar.style.display === 'none';
    sidebar.style.display = hidden ? 'flex' : 'none';
    mainContainer.style.marginLeft = hidden ? '260px' : '0';
    mainContainer.style.width = hidden ? 'calc(100% - 260px)' : '100%';
    toggleBtn.style.left = hidden ? '260px' : '0';
};

/* Zoom slider */
document.getElementById('pickerZoom').oninput = e => {
    document.documentElement.style.setProperty('--picker-scale', e.target.value);
    adjustPickerWidth();
};

/* Confetti size slider */
document.getElementById('confettiSize').oninput = e => {
    document.documentElement.style.setProperty('--confetti-size', e.target.value + 'px');
    bgNames = [];
    updateBackgroundNames();
};

let originalStudents = [];
let currentStudents = [];
let bgNames = [];

const studentListTextarea = document.getElementById('studentList');
const nameReel = document.getElementById('nameReel');
const pickBtnHeader = document.getElementById('pickStudentHeaderBtn');
const pickerDisplay = document.getElementById('pickerDisplay');
const resetBtn = document.getElementById('resetListBtn');
const backgroundDiv = document.getElementById('backgroundNames');
const pickedFooter = document.getElementById('pickedStudentsFooter');

const portalColors = ['#E69A10', '#6B5B4E', '#C5830D', '#D48A08'];

function updateStudentArray() {
    originalStudents = studentListTextarea.value.split('\n').map(s => s.trim()).filter(Boolean);
    currentStudents = [...originalStudents];
    populateReel(currentStudents, 0);
    adjustPickerWidth();
    bgNames = [];
    updateBackgroundNames();
}

function adjustPickerWidth() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    let maxWidth = 100;
    currentStudents.forEach(name => {
        ctx.font = '24px Poppins';
        const normalWidth = ctx.measureText(name).width;
        ctx.font = '48px Poppins';
        const highlightWidth = ctx.measureText(name).width;
        const width = Math.max(normalWidth, highlightWidth) + 60;
        if (width > maxWidth) maxWidth = width;
    });

    const sidebarWidth = sidebar.style.display === 'none' ? 0 : sidebar.offsetWidth;
    const maxAllowed = window.innerWidth - sidebarWidth - 40;
    maxWidth = Math.min(maxWidth, maxAllowed);

    pickerDisplay.style.width = maxWidth + 'px';
}

function populateReel(names, highlightIndex) {
    nameReel.innerHTML = '';
    names.forEach((name, idx) => {
        const div = document.createElement('div');
        div.textContent = name;
        if (idx === highlightIndex) div.classList.add('current');
        nameReel.appendChild(div);
    });
}

function updateBackgroundNames() {
    const sidebarWidth = sidebar.style.display === 'none' ? 0 : sidebar.offsetWidth;
    const visibleWidth = window.innerWidth - sidebarWidth;
    const visibleHeight = window.innerHeight - 80;

    const baseSize = 48;
    const confettiSize = parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--confetti-size'));
    const densityMultiplier = baseSize / confettiSize;

    const baseNeeded = Math.ceil(visibleHeight / 50) * Math.ceil(visibleWidth / 200);
    const needed = Math.ceil(baseNeeded * densityMultiplier);

    while (bgNames.length < needed && currentStudents.length) {
        const name = currentStudents[Math.floor(Math.random() * currentStudents.length)];
        bgNames.push({
            name,
            x: Math.random() * visibleWidth + sidebarWidth,
            y: Math.random() * visibleHeight,
            dx: (Math.random() * 0.5 + 0.1) * (Math.random() < 0.5 ? -1 : 1),
            dy: (Math.random() * 0.5 + 0.1) * (Math.random() < 0.5 ? -1 : 1),
            color: portalColors[Math.floor(Math.random() * portalColors.length)]
        });
    }

    bgNames.length = Math.min(bgNames.length, needed);
}

function animateBackground() {
    const sidebarWidth = sidebar.style.display === 'none' ? 0 : sidebar.offsetWidth;
    backgroundDiv.innerHTML = '';

    bgNames.forEach(obj => {
        obj.x += obj.dx;
        obj.y += obj.dy;

        if (obj.x > window.innerWidth) obj.x = sidebarWidth - 200;
        if (obj.x < sidebarWidth - 200) obj.x = window.innerWidth;
        if (obj.y > window.innerHeight) obj.y = -50;
        if (obj.y < -50) obj.y = window.innerHeight;

        const div = document.createElement('div');
        div.textContent = obj.name;
        div.style.left = obj.x + 'px';
        div.style.top = obj.y + 'px';
        div.style.color = obj.color;
        backgroundDiv.appendChild(div);
    });

    requestAnimationFrame(animateBackground);
}

/* Core Pick Student Function */
function pickStudent() {
    if (pickBtnHeader.disabled) return;

    if (currentStudents.length === 0) {
        alert("No students left to pick!");
        return;
    }
    pickBtnHeader.disabled = true;

    const pickedIndex = Math.floor(Math.random() * currentStudents.length);
    const reelNames = [];
    for (let i = 0; i < 30; i++) reelNames.push(...currentStudents);
    populateReel(reelNames, 0);

    const displayHeight = pickerDisplay.clientHeight;
    const middleOffset = Math.floor(displayHeight / 2 / 50);
    const finalIndex = pickedIndex + currentStudents.length * 15;
    const finalOffset = -(finalIndex - middleOffset) * 50;
    const duration = 4000;
    let start = null;

    function animate(timestamp) {
        if (!start) start = timestamp;
        let progress = (timestamp - start) / duration;
        if (progress > 1) progress = 1;
        progress = 1 - Math.pow(1 - progress, 3);

        nameReel.style.transform = `translateY(${progress * finalOffset}px)`;

        const current = Math.round(
            -parseFloat(nameReel.style.transform.replace('translateY(', '').replace('px)', '')) / 50
        ) + middleOffset;

        nameReel.childNodes.forEach((div, idx) => {
            if (idx === current) {
                div.classList.add('current');
                const glow = portalColors[Math.floor(Math.random() * portalColors.length)];
                div.style.textShadow = `0 0 8px ${glow}, 0 0 16px ${glow}`;
            } else {
                div.classList.remove('current');
                div.style.textShadow = '';
            }
        });

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            const pickedName = currentStudents.splice(pickedIndex, 1)[0];
            studentListTextarea.value = currentStudents.join('\n');
            bgNames = bgNames.filter(obj => obj.name !== pickedName);
            updateBackgroundNames();
            pickBtnHeader.disabled = false;

            const newDiv = document.createElement('div');
            newDiv.textContent = pickedName;
            pickedFooter.appendChild(newDiv);
            pickedFooter.scrollTop = pickedFooter.scrollHeight;
        }
    }
    requestAnimationFrame(animate);
}

/* Event Listeners */
pickBtnHeader.onclick = pickStudent;
pickerDisplay.onclick = pickStudent;

/* Reset */
resetBtn.onclick = () => {
    updateStudentArray();
    pickedFooter.innerHTML = '';
};
studentListTextarea.addEventListener('input', updateStudentArray);

window.onload = function() {
    generateBackgroundHexagons();
    updateStudentArray();
    animateBackground();
};
</script>

</body>
</html>
