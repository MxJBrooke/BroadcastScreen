<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>Packaging Designer</title>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    overflow:hidden;
    background:#111;
    color:white;
    font-family:Arial;
}

/* =========================================
   PAGES
========================================= */

.page{
    position:absolute;
    inset:0;
    display:flex;
}

.hidden{
    display:none;
}

/* =========================================
   SIDEBAR
========================================= */

.sidebar{
    width:320px;
    background:#1f1f1f;
    border-right:1px solid #333;
    padding:16px;
    overflow:auto;
}

.section{
    background:#2b2b2b;
    padding:14px;
    border-radius:12px;
    margin-bottom:14px;
}

.section h3{
    margin-top:0;
}

/* =========================================
   CONTROLS
========================================= */

label{
    display:block;
    margin-bottom:18px;
    font-size:14px;
}

input[type="range"]{
    width:100%;
    margin-top:8px;
}

.value{
    margin-top:6px;
    color:#aaa;
    font-size:13px;
}

button,
input[type="file"]{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#3a3a3a;
    color:white;
    margin-top:10px;
    cursor:pointer;
}

/* =========================================
   CONTENT
========================================= */

.content{
    flex:1;
    overflow:auto;
    background:#181818;
}

/* =========================================
   NET
========================================= */

.netWrap{
    min-width:100%;
    min-height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.net{
    display:grid;
    grid-template-columns:repeat(4, auto);
    grid-template-rows:repeat(3, auto);
    gap:0;
}

canvas{
    background:white;
    display:block;
}

/* CROSS */

#top    { grid-column:2; grid-row:1; }

#left   { grid-column:1; grid-row:2; }
#front  { grid-column:2; grid-row:2; }
#right  { grid-column:3; grid-row:2; }
#back   { grid-column:4; grid-row:2; }

#bottom { grid-column:2; grid-row:3; }

/* =========================================
   3D VIEW
========================================= */

#viewer{
    width:100%;
    height:100%;
}

/* =========================================
   PIP
========================================= */

.pip{
    position:fixed;
    right:20px;
    bottom:20px;
    width:240px;
    height:160px;
    border-radius:14px;
    overflow:hidden;
    border:3px solid #444;
    background:#000;
    z-index:100;
    cursor:pointer;
    box-shadow:0 0 25px rgba(0,0,0,0.6);
}

#pip3d{
    display:block;
}

#pip2d{
    display:none;
}

#miniNet{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#111;
}

#miniNet .net{
    transform:scale(0.2);
    transform-origin:center;
}

.pipLabel{
    position:absolute;
    top:8px;
    left:8px;
    background:#000b;
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    z-index:10;
}

/* =========================================
   TEXT
========================================= */

.instructions{
    color:#bbb;
    line-height:1.5;
    font-size:14px;
}

</style>
</head>

<body>

<!-- =========================================
     2D PAGE
========================================= -->

<div class="page" id="page2d">

    <div class="sidebar">

        <div class="section">

            <h3>Box Dimensions</h3>

            <label>

                Width

                <input
                    type="range"
                    id="widthSlider"
                    min="1"
                    max="10"
                    step="0.1"
                    value="3"
                >

                <div class="value" id="widthValue">
                    3
                </div>

            </label>

            <label>

                Height

                <input
                    type="range"
                    id="heightSlider"
                    min="1"
                    max="10"
                    step="0.1"
                    value="2"
                >

                <div class="value" id="heightValue">
                    2
                </div>

            </label>

            <label>

                Depth

                <input
                    type="range"
                    id="depthSlider"
                    min="1"
                    max="10"
                    step="0.1"
                    value="2"
                >

                <div class="value" id="depthValue">
                    2
                </div>

            </label>

        </div>

        <div class="section">

            <h3>Artwork</h3>

            <button onclick="exportNet()">
                Export PNG
            </button>

            <input
                type="file"
                id="importNet"
                accept="image/png"
            >

        </div>

        <div class="section">

            <h3>Instructions</h3>

            <div class="instructions">

                Export the template.<br><br>

                Edit it in Photoshop,
                Illustrator,
                Paint etc.<br><br>

                Re-import it and the
                3D package updates
                automatically.

            </div>

        </div>

    </div>

    <div class="content">

        <div class="netWrap">

            <div class="net" id="mainNet">

                <canvas id="top"></canvas>

                <canvas id="left"></canvas>
                <canvas id="front"></canvas>
                <canvas id="right"></canvas>
                <canvas id="back"></canvas>

                <canvas id="bottom"></canvas>

            </div>

        </div>

    </div>

</div>

<!-- =========================================
     3D PAGE
========================================= -->

<div class="page hidden" id="page3d">

    <div id="viewer"></div>

</div>

<!-- =========================================
     PIP 3D
========================================= -->

<div class="pip" id="pip3d">

    <div class="pipLabel">
        3D Preview
    </div>

</div>

<!-- =========================================
     PIP 2D
========================================= -->

<div class="pip" id="pip2d">

    <div class="pipLabel">
        2D Net
    </div>

    <div id="miniNet"></div>

</div>

<script>

/* =========================================
   BOX
========================================= */

let box = {
    w:3,
    h:2,
    d:2
};

let importedImage = null;

/* =========================================
   CONSTANTS
========================================= */

const BASE = 120;

const ids = [
    "top",
    "left",
    "front",
    "right",
    "back",
    "bottom"
];

const canvases = {};
const ctxs = {};
const textures = {};

/* =========================================
   CANVASES
========================================= */

ids.forEach(id=>{

    const c = document.getElementById(id);

    const ctx = c.getContext("2d");

    canvases[id] = c;
    ctxs[id] = ctx;

    const tex = new THREE.CanvasTexture(c);

    tex.flipY = true;

    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

    textures[id] = tex;
});

/* ❌ REMOVED (this was breaking BACK face)
textures.back.repeat.x = -1;
textures.back.offset.x = 1;
*/

/* =========================================
   FACE SIZES
========================================= */

function getFaceSizes(){

    return {

        top:{
            w:box.w,
            h:box.d
        },

        bottom:{
            w:box.w,
            h:box.d
        },

        left:{
            w:box.d,
            h:box.h
        },

        right:{
            w:box.d,
            h:box.h
        },

        front:{
            w:box.w,
            h:box.h
        },

        back:{
            w:box.w,
            h:box.h
        }
    };
}

/* =========================================
   LAYOUT
========================================= */

function getLayout(){

    const f = getFaceSizes();

    return {

        top:{
            x:f.left.w,
            y:0,
            w:f.top.w,
            h:f.top.h
        },

        left:{
            x:0,
            y:f.top.h,
            w:f.left.w,
            h:f.left.h
        },

        front:{
            x:f.left.w,
            y:f.top.h,
            w:f.front.w,
            h:f.front.h
        },

        right:{
            x:f.left.w + f.front.w,
            y:f.top.h,
            w:f.right.w,
            h:f.right.h
        },

        back:{
            x:f.left.w + f.front.w + f.right.w,
            y:f.top.h,
            w:f.back.w,
            h:f.back.h
        },

        bottom:{
            x:f.left.w,
            y:f.top.h + f.front.h,
            w:f.bottom.w,
            h:f.bottom.h
        }
    };
}

/* =========================================
   DRAW FACE
========================================= */

function drawFace(id){

    const c = canvases[id];
    const ctx = ctxs[id];

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,c.width,c.height);

    ctx.strokeStyle = "black";
    ctx.lineWidth = 4;
    ctx.strokeRect(0,0,c.width,c.height);

    ctx.fillStyle = "#777";

    ctx.font = "26px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        id.toUpperCase(),
        c.width/2,
        c.height/2
    );
}

/* =========================================
   RESIZE NET
========================================= */

function resizeNet(){

    const faces = getFaceSizes();

    ids.forEach(id=>{

        const c = canvases[id];

        c.width = faces[id].w * BASE;
        c.height = faces[id].h * BASE;

        c.style.width = c.width + "px";
        c.style.height = c.height + "px";

        drawFace(id);

        textures[id].needsUpdate = true;
    });
}

/* =========================================
   THREE
========================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x111111);

const camera =
    new THREE.PerspectiveCamera(
        60,
        1,
        0.1,
        1000
    );

camera.position.set(6,5,8);

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    window.devicePixelRatio
);

document
.getElementById("viewer")
.appendChild(renderer.domElement);

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);

const light =
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

light.position.set(5,10,5);

scene.add(light);

let cube;

/* =========================================
   BUILD CUBE
========================================= */

function buildCube(){

    if(cube){

        scene.remove(cube);

        cube.geometry.dispose();

        cube.material.forEach(
            m=>m.dispose()
        );
    }

    const mats = [

        new THREE.MeshStandardMaterial({
            map:textures.right
        }),

        new THREE.MeshStandardMaterial({
            map:textures.left
        }),

        new THREE.MeshStandardMaterial({
            map:textures.top
        }),

        new THREE.MeshStandardMaterial({
            map:textures.bottom
        }),

        new THREE.MeshStandardMaterial({
            map:textures.front
        }),

        new THREE.MeshStandardMaterial({
            map:textures.back
        })
    ];

    cube = new THREE.Mesh(

        new THREE.BoxGeometry(
            box.w,
            box.h,
            box.d
        ),

        mats
    );

    scene.add(cube);
}

/* =========================================
   RESIZE RENDERER
========================================= */

function resizeRenderer(){

    const v =
        document.getElementById(
            "viewer"
        );

    const w = v.clientWidth;
    const h = v.clientHeight;

    renderer.setSize(w,h);

    camera.aspect = w/h;

    camera.updateProjectionMatrix();
}

window.addEventListener(
    "resize",
    resizeRenderer
);

/* =========================================
   EXPORT
========================================= */

function exportNet(){

    const layout = getLayout();

    const totalW = (

        layout.back.x +
        layout.back.w

    ) * BASE;

    const totalH = (

        layout.bottom.y +
        layout.bottom.h

    ) * BASE;

    const out =
        document.createElement(
            "canvas"
        );

    out.width = totalW;
    out.height = totalH;

    const ctx =
        out.getContext("2d");

    ctx.fillStyle = "white";

    ctx.fillRect(
        0,
        0,
        totalW,
        totalH
    );

    ids.forEach(id=>{

        const p = layout[id];

        ctx.drawImage(

            canvases[id],

            p.x * BASE,
            p.y * BASE
        );
    });

    const a =
        document.createElement("a");

    a.href =
        out.toDataURL("image/png");

    const w =
        box.w.toFixed(1);

    const h =
        box.h.toFixed(1);

    const d =
        box.d.toFixed(1);

    a.download =
        `box_w${w}_h${h}_d${d}.png`;

    a.click();
}

/* =========================================
   IMPORT
========================================= */

importNet.onchange = e=>{

    const file =
        e.target.files[0];

    if(!file) return;

    restoreBoxFromFilename(
        file.name
    );

    const img = new Image();

    img.onload = ()=>{

        importedImage = img;

        applyImportedTextures(img);
    };

    img.src =
        URL.createObjectURL(file);
};

/* =========================================
   RESTORE SIZE FROM FILENAME
========================================= */

function restoreBoxFromFilename(name){

    const wMatch =
        name.match(/_w([\d.]+)/);

    const hMatch =
        name.match(/_h([\d.]+)/);

    const dMatch =
        name.match(/_d([\d.]+)/);

    if(wMatch){
        box.w = parseFloat(wMatch[1]);
    }

    if(hMatch){
        box.h = parseFloat(hMatch[1]);
    }

    if(dMatch){
        box.d = parseFloat(dMatch[1]);
    }

    widthSlider.value = box.w;
    heightSlider.value = box.h;
    depthSlider.value = box.d;

    update();
}

/* =========================================
   APPLY IMPORTED ARTWORK
========================================= */

function applyImportedTextures(img){

    const layout = getLayout();

    ids.forEach(id=>{

        const c = canvases[id];
        const ctx = ctxs[id];

        const p = layout[id];

        ctx.clearRect(
            0,
            0,
            c.width,
            c.height
        );

        ctx.drawImage(

            img,

            p.x * BASE,
            p.y * BASE,

            p.w * BASE,
            p.h * BASE,

            0,
            0,

            c.width,
            c.height
        );

        textures[id].needsUpdate = true;
    });
}

/* =========================================
   SLIDERS
========================================= */

function updateSliders(){

    widthValue.innerText =
        box.w.toFixed(1);

    heightValue.innerText =
        box.h.toFixed(1);

    depthValue.innerText =
        box.d.toFixed(1);
}

widthSlider.oninput = ()=>{

    box.w = parseFloat(widthSlider.value);
    update();
};

heightSlider.oninput = ()=>{

    box.h = parseFloat(heightSlider.value);
    update();
};

depthSlider.oninput = ()=>{

    box.d = parseFloat(depthSlider.value);
    update();
};

/* =========================================
   PAGE SWITCH
========================================= */

const page2d =
    document.getElementById("page2d");

const page3d =
    document.getElementById("page3d");

const pip2d =
    document.getElementById("pip2d");

const pip3d =
    document.getElementById("pip3d");

let current = "2d";

document
.getElementById("miniNet")
.appendChild(
    document
    .getElementById("mainNet")
    .cloneNode(true)
);

function switchView(){

    if(current === "2d"){

        current = "3d";

        page2d.classList.add("hidden");
        page3d.classList.remove("hidden");

        pip3d.style.display = "none";
        pip2d.style.display = "block";
    } else {

        current = "2d";

        page3d.classList.add("hidden");
        page2d.classList.remove("hidden");

        pip2d.style.display = "none";
        pip3d.style.display = "block";
    }

    resizeRenderer();
}

pip2d.onclick = switchView;
pip3d.onclick = switchView;

/* =========================================
   UPDATE + LOOP
========================================= */

function update(){

    resizeNet();

    if(importedImage){
        applyImportedTextures(importedImage);
    }

    buildCube();
    resizeRenderer();
    updateSliders();
}

function animate(){

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene,camera);
}

update();
animate();

</script>

</body>
</html>
