<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard - Mx Brooke's Education Resources</title>

<style>
:root {
    --bg-main: #FFF4E6;
    --header-bg: #4A3E32;
    --accent-amber: #E69A10;
    --accent-hover: #C5830D;
    --accent-gold: #E69A10;
    --text-dark: #2C241D;
    --text-muted: #6B5B4E;
    --card-bg: #FFFFFF;
    --card-border: #F0D5B7;
    
    /* Hexagon & Angular Clip Paths */
    --hex-cut-sm: polygon(8px 0%, calc(100% - 8px) 0%, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0% calc(100% - 8px), 0% 8px);
    
    /* Pointy-top Hexagon Clip Path for Tesselation */
    --hex-block: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background-color: var(--bg-main);
  color: var(--text-dark);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  overflow-x: auto;
  position: relative;
  background-image: radial-gradient(var(--card-border) 1px, transparent 1px);
  background-size: 32px 32px;
}

/* Background Hollow Hexagons Container */
.bg-hexagons {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.bg-hex {
    position: absolute;
    background: transparent;
}

.bg-hex svg {
    width: 100%;
    height: 100%;
    fill: none;
    stroke-width: 5px;
    stroke-linejoin: round;
}

/* Header */
#header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 80px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  background-color: var(--header-bg);
  border-bottom: 3px solid #3D3227;
  padding: 0 24px;
  box-sizing: border-box;
  z-index: 15;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.header-controls-left {
  display: flex;
  gap: 10px;
  align-items: center;
}

.header-controls-right {
  display: flex;
  gap: 15px;
  align-items: center;
}

button {
  background-color: var(--accent-amber);
  color: #2C241D;
  border: none;
  border-radius: 0;
  padding: 8px 16px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  clip-path: var(--hex-cut-sm);
  transition: background-color 0.2s ease, transform 0.2s ease;
}

button:hover {
  background-color: var(--accent-hover);
  transform: translateY(-1px);
}

#animateButton {
  background-color: var(--accent-amber);
  font-size: 15px;
  padding: 8px 18px;
}

#settingsBtn {
  background-color: #3D3227;
  color: #FFF;
  font-size: 15px;
  padding: 8px 18px;
}

#settingsBtn:hover {
  background-color: #544638;
}

#configSwitcher {
  background: #3D3227;
  color: white;
  border: 1px solid #6B5B4E;
  border-radius: 0;
  font-size: 14px;
  padding: 6px;
  font-family: 'Poppins', sans-serif;
  clip-path: var(--hex-cut-sm);
}

.brand-section {
    display: flex;
    align-items: center;
    gap: 16px;
    justify-self: center;
    grid-column: 2;
    text-decoration: none;
}

.brand-section img.logo {
    height: 52px;
    width: auto;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.brand-section img.logo:hover {
    transform: scale(1.05) rotate(-2deg);
}

.brand-title {
    color: #FFFFFF;
    font-size: 1.1rem;
    font-weight: bold;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
}

.brand-title::after {
    content: "⬡";
    color: var(--accent-amber);
    font-size: 1.2rem;
}

#pointsDisplay {
  color: #FFE8CF;
  font-weight: bold;
  white-space: nowrap;
}

/* Sidebar Layout */
#sidebar {
  position: fixed;
  top: 80px; 
  left: 0;
  width: 260px;
  height: calc(100vh - 80px);
  background-color: var(--header-bg);
  border-right: 3px solid #3D3227;
  padding: 20px;
  box-sizing: border-box;
  color: white;
  z-index: 10;
  overflow-y: auto;
  box-shadow: 4px 0 15px rgba(0,0,0,0.1);
}

#sidebar h2 {
  margin-top: 0;
  margin-bottom: 20px;
  font-size: 1.1rem;
  border-bottom: 1px solid #6B5B4E;
  padding-bottom: 10px;
  color: var(--accent-amber);
  display: flex;
  align-items: center;
  gap: 8px;
}

#sidebar h2::before {
  content: "⬡";
}

.sidebar-group {
  margin-bottom: 20px;
}

.sidebar-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  color: #FFE8CF;
  font-weight: bold;
}

#sidebar textarea {
  width: 100%;
  resize: vertical;
  background: #3D3227;
  color: white;
  border: 1px solid #6B5B4E;
  padding: 8px;
  border-radius: 4px;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

/* Target Row Controls */
.target-input-group {
  display: flex;
  gap: 6px;
  align-items: center;
  width: 100%;
}

.target-input-group input[type="number"] {
  width: 90px;
  height: 34px;
  background: #3D3227;
  color: white;
  border: 1px solid #6B5B4E;
  padding: 0 10px;
  border-radius: 4px;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

.target-input-group input[type="color"] {
  width: 40px;
  height: 34px;
  background: none;
  border: 1px solid #6B5B4E;
  border-radius: 4px;
  cursor: pointer;
  padding: 0;
  box-sizing: border-box;
}

.target-input-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.target-input-group input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }

.target-input-group button {
  flex: 1;
  height: 34px;
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

.target-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #3D3227;
  padding: 6px 10px;
  margin-bottom: 4px;
  font-size: 13px;
  border: 1px solid #6B5B4E;
  border-radius: 4px;
}

.target-item button {
  width: auto;
  margin: 0;
  padding: 2px 8px;
  background: #8b3a3a;
  border: none;
  font-size: 11px;
  color: white;
  clip-path: var(--hex-cut-sm);
}

.config-action-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#sidebar button.full-width {
  width: 100%;
  padding: 8px;
  box-sizing: border-box;
}

#exportBtn {
  background: #6B5B4E;
  color: white;
}
#exportBtn:hover {
  background: #544638;
}

#importBtn {
  background: #3D3227;
  color: white;
  border: 1px solid #6B5B4E;
}
#importBtn:hover {
  background: #544638;
}

#jsonInput {
  display: none;
}

/* Floating Settings Window */
#floatingSettings {
  display: none;
  position: fixed;
  top: 90px;
  right: 20px;
  width: 280px;
  background-color: var(--header-bg);
  border: 2px solid #3D3227;
  border-radius: 6px;
  padding: 15px;
  box-sizing: border-box;
  color: white;
  z-index: 50;
  box-shadow: 0 5px 20px rgba(0,0,0,0.3);
}

#floatingSettings.open {
  display: block;
}

#floatingSettings-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  border-bottom: 1px solid #6B5B4E;
  padding-bottom: 10px;
}

#floatingSettings-header h3 { margin: 0; font-size: 16px; color: var(--accent-amber); }

#closeSettingsBtn {
  background: none;
  border: none;
  color: #ccc;
  font-size: 16px;
  cursor: pointer;
}
#closeSettingsBtn:hover { color: white; }

#floatingSettings label {
  display: block;
  margin-top: 8px;
  font-size: 13px;
  color: #FFE8CF;
}
#floatingSettings input[type="number"],
#floatingSettings input[type="range"] {
  width: 100%;
  margin-bottom: 5px;
  background: #3D3227;
  color: white;
  border: 1px solid #6B5B4E;
  padding: 6px;
  box-sizing: border-box;
  border-radius: 4px;
}

/* Toggle sidebar button */
#toggleSidebar {
  position: fixed;
  left: 10px;
  bottom: 10px;
  z-index: 20;
  background-color: var(--header-bg);
  color: var(--accent-amber);
  border: 2px solid #3D3227;
  clip-path: var(--hex-cut-sm);
  font-weight: bold;
}
#toggleSidebar:hover {
  background-color: #3D3227;
}

/* Board container */
#boardContainer {
  margin-top: 80px;
  margin-left: 260px;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 80px);
  z-index: 5;
  position: relative;
}

#boardZoom {
  transform-origin: bottom center;
}

#board {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 16px;
  position: relative;
}

/* Target Line Overlays */
.target-line {
  position: absolute;
  left: -40px;
  right: -40px;
  border-bottom: 2px dashed;
  z-index: 5;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  transition: bottom 0.2s;
}

.target-label {
  background: var(--bg-main);
  padding: 2px 6px;
  font-size: 12px;
  border-radius: 4px;
  font-weight: bold;
  transform: translateY(50%);
}

/* Columns */
.column {
  display: flex;
  flex-direction: column;
  align-items: center;
  border-left: 2px solid var(--card-border);
  border-right: 2px solid var(--card-border);
  padding: 10px 18px;
  position: relative;
  z-index: 2;
  background: rgba(255, 255, 255, 0.6);
  border-radius: 4px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.column-text {
  margin-bottom: 16px;
  color: var(--text-dark);
  font-weight: bold;
  text-align: center;
  visibility: hidden;
  width: 100%;
}

.column-text div { 
  writing-mode: vertical-rl; 
  margin: 0 auto;
}

.column:hover .column-text { transform: scale(1.1); color: var(--accent-amber); }

/* Medals */
.gold { box-shadow: 0 0 25px 8px gold; }
.silver { box-shadow: 0 0 25px 8px silver; }
.bronze { box-shadow: 0 0 25px 8px #cd7f32; }

/* Tesselating Hexagon Blocks */
.blocks-wrapper {
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  width: 100%;
}

.block-row {
  display: flex;
  justify-content: center;
  margin-bottom: -7px;
  width: 100%;
}

.block-row:nth-child(even) {
  /* Exact horizontal shift for true honeycomb alignment */
  transform: translateX(12px);
}

.block {
  width: 24px;
  height: 28px;
  clip-path: var(--hex-block);
  opacity: 0;
  transform: translateY(-30px);
  flex-shrink: 0;
}

@keyframes fallIn { to { opacity: 1; transform: translateY(0); } }
.block.animate { animation: fallIn 0.3s ease forwards; }
</style>
</head>

<body>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Dynamically Generated Random Background Hexagons -->
<div class="bg-hexagons" id="bgHexagonsContainer"></div>

<header id="header">
  <div class="header-controls-left">
    <button id="animateButton">Play ⬡</button>
    <select id="configSwitcher" style="display:none;"></select>
  </div>
  
  <div class="brand-section">
      <a href="https://www.mxbrooke.co.uk">
          <img src="https://www.mxbrooke.co.uk/images/logo.svg" alt="MXB Logo" class="logo" title="Mx Brooke's Education Resources">
      </a>
      <a href="https://www.mxbrooke.co.uk" class="brand-title">MxBrooke.co.uk</a>
  </div>
  
  <div class="header-controls-right">
    <div id="pointsDisplay">5 points per block</div>
    <button id="settingsBtn">Settings</button>
  </div>
</header>

<div id="sidebar">
  <h2>Data & Targets</h2>

  <div class="sidebar-group">
    <label>Student data (Name,Points)</label>
    <textarea id="dataInput" rows="12"></textarea>
  </div>

  <div class="sidebar-group">
    <label>Target Lines</label>
    <div class="target-input-group">
      <input type="number" id="targetPointsInput" placeholder="Pts">
      <input type="color" id="targetColorInput" value="#E69A10">
      <button id="addTargetBtn">Add</button>
    </div>
    <div id="targetListContainer" style="margin-top: 10px;"></div>
  </div>

  <div class="sidebar-group" style="margin-top: 30px; border-top: 1px solid #6B5B4E; padding-top: 20px;">
    <label>Config Manager</label>
    <div class="config-action-group">
      <button id="exportBtn" class="full-width">Save Config</button>
      <button id="importBtn" class="full-width">Upload Configs</button>
    </div>
    <input type="file" id="jsonInput" accept=".json" multiple hidden>
  </div>
</div>

<div id="floatingSettings">
  <div id="floatingSettings-header">
    <h3>Layout Settings</h3>
    <button id="closeSettingsBtn">X</button>
  </div>

  <label>Starting point (Min Pts)</label>
  <input type="number" id="baseInput" value="0" min="0">

  <label>Points per block</label>
  <input type="number" id="scaleInput" value="5" min="1">

  <label>Blocks per row</label>
  <input type="range" id="widthSlider" min="1" max="20" value="8">

  <label>Bunching (Gap)</label>
  <input type="range" id="gapSlider" min="0" max="30" value="10">

  <label>Zoom</label>
  <input type="range" id="zoomSlider" min="50" max="150" value="100">

  <label>Animation speed</label>
  <input type="range" id="speedSlider" min="10" max="100" value="25">

  <label style="margin-top: 15px; display: flex; align-items: center; gap: 8px;">
    <input type="checkbox" id="medalCheckbox" checked style="margin:0;"> Show Medals
  </label>
</div>

<button id="toggleSidebar">Controls</button>

<div id="boardContainer">
  <div id="boardZoom">
    <div id="board"></div>
  </div>
</div>

<script>
// Randomly Generate Background Hexagons on Load
function generateBackgroundHexagons() {
    const container = document.getElementById('bgHexagonsContainer');
    const palette = ['#E69A10', '#4A3E32', '#3D3227', '#6B5B4E'];
    const count = 7;

    for (let i = 0; i < count; i++) {
        const hex = document.createElement('div');
        hex.className = 'bg-hex';

        const size = Math.floor(Math.random() * 160) + 120;
        hex.style.width = size + 'px';
        hex.style.height = (size * 1.14) + 'px';

        const topPos = Math.random() * 85;
        const leftPos = Math.random() * 90;
        hex.style.top = topPos + '%';
        hex.style.left = leftPos + '%';

        const rotation = Math.random() * 60 - 30;
        const opacity = (Math.random() * 0.15 + 0.08).toFixed(2);
        hex.style.transform = `rotate(${rotation}deg)`;
        hex.style.opacity = opacity;

        const color = palette[Math.floor(Math.random() * palette.length)];
        hex.innerHTML = `<svg viewBox="0 0 100 100"><polygon points="25,5 75,5 95,50 75,95 25,95 5,50" stroke="${color}" /></svg>`;
        container.appendChild(hex);
    }
}

const board = document.getElementById('board');
const boardZoom = document.getElementById('boardZoom');
const boardContainer = document.getElementById('boardContainer');
const dataInput = document.getElementById('dataInput');
const animateButton = document.getElementById('animateButton');

// Settings Elements
const settingsBtn = document.getElementById('settingsBtn');
const closeSettingsBtn = document.getElementById('closeSettingsBtn');
const floatingSettings = document.getElementById('floatingSettings');

const baseInput = document.getElementById('baseInput');
const scaleInput = document.getElementById('scaleInput');
const widthSlider = document.getElementById('widthSlider');
const gapSlider = document.getElementById('gapSlider');
const zoomSlider = document.getElementById('zoomSlider');
const speedSlider = document.getElementById('speedSlider');
const medalCheckbox = document.getElementById('medalCheckbox');

const sidebar = document.getElementById('sidebar');
const toggleSidebar = document.getElementById('toggleSidebar');
const pointsDisplay = document.getElementById('pointsDisplay');

const targetPointsInput = document.getElementById('targetPointsInput');
const targetColorInput = document.getElementById('targetColorInput');
const addTargetBtn = document.getElementById('addTargetBtn');
const targetListContainer = document.getElementById('targetListContainer');

const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const jsonInput = document.getElementById('jsonInput');
const configSwitcher = document.getElementById('configSwitcher');

// Red, Orange, and Yellow theme palette
const themeColors = ['#DC2626', '#EA580C', '#D97706', '#EAB308', '#F59E0B', '#EF4444', '#B45309', '#F97316'];
let dataStore = [];
let targetLines = [];
let loadedConfigs = {};

/* Floating Settings Toggle */
settingsBtn.onclick = () => floatingSettings.classList.toggle('open');
closeSettingsBtn.onclick = () => floatingSettings.classList.remove('open');

/* Sidebar toggle */
toggleSidebar.onclick = () => {
  sidebar.style.display = sidebar.style.display === 'none' ? 'block' : 'none';
  boardContainer.style.marginLeft = sidebar.style.display === 'none' ? '0' : '260px';
};

/* Live listeners */
zoomSlider.oninput = () => boardZoom.style.transform = `scale(${zoomSlider.value/100})`;
gapSlider.oninput = () => board.style.gap = gapSlider.value + 'px';
baseInput.oninput = renderBoard;
widthSlider.oninput = renderBoard;
scaleInput.oninput = renderBoard;

/* Target Lines Logic */
function updateTargetUI() {
  targetListContainer.innerHTML = '';
  targetLines.forEach((t, index) => {
    const el = document.createElement('div');
    el.className = 'target-item';
    el.innerHTML = `
      <span><span style="color:${t.color}">■</span> ${t.points} pts</span>
      <button onclick="removeTarget(${index})">Remove</button>
    `;
    targetListContainer.appendChild(el);
  });
  renderBoard();
}

window.removeTarget = (index) => {
  targetLines.splice(index, 1);
  updateTargetUI();
};

addTargetBtn.onclick = () => {
  const pts = +targetPointsInput.value;
  if (pts > 0) {
    targetLines.push({ points: pts, color: targetColorInput.value });
    targetPointsInput.value = '';
    updateTargetUI();
  }
};

/* Data parsing */
function parseData() {
  dataStore = dataInput.value.trim().split(/\r?\n/)
    .map(line => {
      const [n,p] = line.split(',');
      if (!n || isNaN(p)) return null;
      return { name: n.trim(), points: +p };
    })
    .filter(Boolean);
  renderBoard();
}

dataInput.addEventListener('input', parseData);

/* Render board & Target Lines */
function renderBoard() {
  board.innerHTML = '';
  if (!dataStore.length) return;

  const sorted = [...dataStore].sort((a,b)=>b.points-a.points);
  const blocksPerRow = +widthSlider.value;
  const pointsPerBlock = Math.max(1, +scaleInput.value);
  const basePoints = Math.max(0, +baseInput.value);
  
  pointsDisplay.textContent = `${pointsPerBlock} pts/block (Baseline: ${basePoints})`;

  const maxRows = Math.max(...sorted.map(s =>
    Math.ceil(Math.max(0, s.points - basePoints) / pointsPerBlock / blocksPerRow)
  ));

  sorted.forEach((item, index) => {
    const col = document.createElement('div');
    col.className = 'column';
    col.dataset.points = item.points;

    const text = document.createElement('div');
    text.className = 'column-text';
    text.innerHTML = `<div>${item.name}</div><div style="margin-top:6px">${item.points} pts</div>`;
    col.appendChild(text);

    const wrap = document.createElement('div');
    wrap.className = 'blocks-wrapper';

    const effectivePoints = Math.max(0, item.points - basePoints);
    const totalBlocks = Math.ceil(effectivePoints / pointsPerBlock);

    for (let r=0; r<maxRows; r++) {
      const row = document.createElement('div');
      row.className = 'block-row';

      for (let c=0; c<blocksPerRow; c++) {
        const i = r*blocksPerRow + c;
        const b = document.createElement('div');
        b.className = 'block';

        if (i < totalBlocks) {
          b.dataset.active = '1';
          b.style.backgroundColor = themeColors[index % themeColors.length];
        } else {
          b.style.visibility = 'hidden';
        }
        row.appendChild(b);
      }
      wrap.appendChild(row);
    }

    col.appendChild(wrap);
    board.appendChild(col);
  });

  const pointsPerRow = pointsPerBlock * blocksPerRow;
  
  targetLines.forEach(line => {
    const effectiveTargetPoints = line.points - basePoints;
    if (effectiveTargetPoints < 0) return; 
    
    const rowsNeeded = Math.ceil(effectiveTargetPoints / pointsPerRow);
    const heightInPx = rowsNeeded * 22;
    
    const lineEl = document.createElement('div');
    lineEl.className = 'target-line';
    
    lineEl.style.bottom = `${heightInPx + 1}px`; 
    lineEl.style.borderBottomColor = line.color;
    lineEl.innerHTML = `<span class="target-label" style="color:${line.color}; border: 1px solid ${line.color};">${line.points}</span>`;
    board.appendChild(lineEl);
  });
}

/* Animate columns sequentially */
animateButton.onclick = () => {
  const columns = [...document.querySelectorAll('.column')];
  const speed = +speedSlider.value;

  columns.forEach(col => {
    col.classList.remove('gold','silver','bronze');
    col.querySelector('.column-text').style.visibility = 'hidden';
    col.querySelectorAll('.block').forEach(b => {
      b.classList.remove('animate');
      b.style.opacity = 0;
    });
  });

  const ordered = [...columns].sort((a,b) => a.dataset.points - b.dataset.points);

  function animateColumn(i) {
    if (i >= ordered.length) {
      if (medalCheckbox.checked) {
        ordered.slice(-3).forEach((c,idx)=>{
          c.classList.add(['bronze','silver','gold'][idx]);
        });
      }
      return;
    }

    const blocks = [...ordered[i].querySelectorAll('[data-active]')];
    if (blocks.length === 0) {
      ordered[i].querySelector('.column-text').style.visibility = 'visible';
      animateColumn(i+1);
      return;
    }

    blocks.forEach((b,j)=> {
      setTimeout(()=>b.classList.add('animate'), j * speed);
    });

    setTimeout(()=>{
      ordered[i].querySelector('.column-text').style.visibility = 'visible';
      animateColumn(i+1);
    }, blocks.length * speed);
  }

  animateColumn(0);
};

/* JSON Save & Load System */
exportBtn.onclick = () => {
  const config = {
    data: dataInput.value,
    base: baseInput.value,
    scale: scaleInput.value,
    width: widthSlider.value,
    gap: gapSlider.value,
    zoom: zoomSlider.value,
    speed: speedSlider.value,
    medals: medalCheckbox.checked,
    lines: targetLines
  };
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  
  let filename = configSwitcher.value ? configSwitcher.value : 'Class_Scoreboard';
  a.download = `${filename}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

importBtn.onclick = () => jsonInput.click();

jsonInput.onchange = async (e) => {
  const files = e.target.files;
  if (!files.length) return;

  for (let file of files) {
    try {
      const text = await file.text();
      const config = JSON.parse(text);
      const name = file.name.replace('.json', '');
      loadedConfigs[name] = config;
    } catch (err) {
      console.error('Failed to parse JSON for file:', file.name);
    }
  }
  
  updateSwitcherUI();
}

function updateSwitcherUI() {
  const names = Object.keys(loadedConfigs);
  if (names.length === 0) return;

  configSwitcher.style.display = 'inline-block';
  configSwitcher.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
  loadConfig(names[0]);
}

configSwitcher.onchange = () => loadConfig(configSwitcher.value);

function loadConfig(name) {
  const c = loadedConfigs[name];
  if (!c) return;

  dataInput.value = c.data || '';
  baseInput.value = c.base || 0;
  scaleInput.value = c.scale || 5;
  widthSlider.value = c.width || 8;
  gapSlider.value = c.gap || 10;
  zoomSlider.value = c.zoom || 100;
  speedSlider.value = c.speed || 25;
  medalCheckbox.checked = c.medals ?? true;
  targetLines = c.lines || [];

  zoomSlider.oninput();
  gapSlider.oninput();
  parseData(); 
  updateTargetUI();
}

/* Seed data initialization */
dataInput.value=`Alan Turing,400
Grace Hopper,380
Donald Knuth,360
Edsger Dijkstra,340
Barbara Liskov,320`;
baseInput.value = 300; 
targetLines = [{points: 350, color: "#E69A10"}, {points: 400, color: "#C5830D"}];

window.onload = function() {
    generateBackgroundHexagons();
    parseData();
    updateTargetUI();
};
</script>
